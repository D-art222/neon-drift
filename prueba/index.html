function drawBigPlanet(P,li,alpha){

  ctx.globalAlpha=alpha*.95;
  if(P.kind==='sun'){const s=1+Math.sin(frame*.03)*.015,sz=img.width*s;ctx.drawImage(img,x-sz/2,y-sz/2,sz,sz);ctx.globalAlpha=1;return;}

  if(P.moon&&behind)ctx.drawImage(P.moon,mx-P.moon.width/2,my-P.moon.height/2);
  ctx.drawImage(img,x-img.width/2,y-img.height/2);
  if(P.clouds){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(frame*.0015+li)*.12);ctx.drawImage(P.clouds,-P.clouds.width/2,-P.clouds.height/2);ctx.restore();ctx.drawImage(P.shade,x-img.width/2,y-img.height/2);}
  if(P.moon&&!behind)ctx.drawImage(P.moon,mx-P.moon.width/2,my-P.moon.height/2);

  ctx.globalAlpha=1;

function getBg(li){

  g.globalCompositeOperation='lighter'; // nebula layer is transparent so it tiles seamlessly while scrolling

function drawBg(li,alpha){

// =====================================================================
//  ONLINE (PeerJS / WebRTC). La librería solo se carga al entrar en
//  "EN LÍNEA", así que el juego de 1 jugador funciona sin internet.
// =====================================================================
const NAT_MSG='e.nat'; // los mensajes se guardan como claves de traducción
const NET_V=4,PREFIX='neondrift-v1-',CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ';
const PEER_URLS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const net={role:null,phase:'menu',peer:null,conn:null,code:'',typed:'',status:'',error:'',connected:false,
  myReady:false,peerReady:false,peerShip:0,peerUp:[0,0,0,0],ups:null,startLv:1,startCamp:'gal',lastRecv:0,snaps:[],renderF:0,remote:null,joinTimer:null,leaving:false};
function setPhase(p){net.phase=p;menuFocus=0;}
function send(m){try{if(net.conn&&net.conn.open)net.conn.send(m);}catch(_){}}
function loadPeer(cb){
  if(window.Peer)return cb(true);
  let i=0,done=false;
  const next=()=>{if(i>=PEER_URLS.length){done=true;return cb(false);}
    const s=document.createElement('script');s.src=PEER_URLS[i++];s.async=true;
    const to=setTimeout(()=>{s.onload=s.onerror=null;s.remove();next();},9000);
    s.onload=()=>{clearTimeout(to);if(window.Peer){done=true;cb(true);}else next();};
    s.onerror=()=>{clearTimeout(to);s.remove();next();};
    document.head.appendChild(s);};
  next();
}
function errMsg(err){
  const t=err&&err.type;
  if(t==='peer-unavailable')return'e.notfound';
  if(t==='unavailable-id')return'e.idused';
  if(t==='browser-incompatible')return'e.browser';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'e.server';
  if(t==='webrtc'||t==='negotiation-failed')return'e.webrtc';
  return['e.generic',t?' ('+t+')':''];
}
function netCleanup(){
  clearTimeout(net.joinTimer);
  const p=net.peer,c=net.conn;net.peer=null;net.conn=null;net.connected=false;
  try{c&&c.close();}catch(_){}
  setTimeout(()=>{try{p&&p.destroy();}catch(_){}},150);
  net.snaps=[];net.remote=null;net.myReady=net.peerReady=false;
}
function netFail(msg){if(net.leaving)return;pmenu=null;netCleanup();mode='solo';state='online';net.error=msg;setPhase('error');sfx('hit');}
function openOnline(){state='online';net.error='';setPhase('menu');sfx('ui');}
function netLeave(){ // avisa al amigo ("bye") y cierra la conexión un poco después para que el aviso llegue antes que el cierre
  send({t:'bye'});const c=net.conn,p=net.peer;clearTimeout(net.joinTimer);
  net.conn=null;net.peer=null;net.connected=false;net.snaps=[];net.remote=null;net.myReady=net.peerReady=false;
  setTimeout(()=>{try{c&&c.close();}catch(_){}try{p&&p.destroy();}catch(_){}},500);
  mode='solo';net.role=null;pmenu=null;openOnline();}
function genCode(){let s='';for(let i=0;i<4;i++)s+=CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)];return s;}
function withPeer(fn){setPhase('loading');net.status='s.loading';
  loadPeer(ok=>{if(state!=='online'||net.phase!=='loading')return;if(!ok)return netFail('e.load');fn();});}
function createRoom(tries=0){
  net.role='host';net.leaving=false;
  withPeer(()=>{
    net.code=genCode();setPhase('host-wait');net.status='s.server';
    let peer;try{peer=new Peer(PREFIX+net.code,{debug:0});}catch(e){return netFail(errMsg({type:'browser-incompatible'}));}
    net.peer=peer;
    peer.on('open',()=>{if(net.peer===peer)net.status='s.wait';});
    peer.on('connection',c=>{
      if(net.conn&&net.conn.open){c.on('open',()=>{try{c.send({t:'full'});}catch(_){}setTimeout(()=>c.close(),400);});return;}
      setupConn(c);});
    peer.on('error',err=>{if(net.peer!==peer)return;
      if(err.type==='unavailable-id'&&tries<4){net.peer=null;try{peer.destroy();}catch(_){}createRoom(tries+1);return;}
      if(err.type==='peer-unavailable')return; // a guest vanished before connecting: ignore
      if(net.connected&&(err.type==='network'||err.type==='server-error'||err.type==='socket-error'||err.type==='socket-closed'))return; // broker lost but P2P link still up
      netFail(errMsg(err));});
    peer.on('disconnected',()=>{if(net.peer===peer&&!net.connected){try{peer.reconnect();}catch(_){}}});
  });
}
function joinRoom(code){
  net.role='guest';net.leaving=false;net.code=code;
  withPeer(()=>{
    setPhase('connecting');net.status='s.server';
    let peer;try{peer=new Peer({debug:0});}catch(e){return netFail(errMsg({type:'browser-incompatible'}));}
    net.peer=peer;
    peer.on('open',()=>{if(net.peer!==peer)return;net.status=['s.search',code];
      const c=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});setupConn(c);
      try{const pc=c.peerConnection;pc&&pc.addEventListener('iceconnectionstatechange',()=>{if(pc.iceConnectionState==='failed'&&net.conn===c&&!net.connected)netFail(NAT_MSG);});}catch(_){}});
    peer.on('error',err=>{if(net.peer!==peer)return;if(net.connected&&err.type!=='peer-unavailable')return;netFail(errMsg(err));});
    clearTimeout(net.joinTimer);
    // si en 15 s no llegó "sala no encontrada", la sala existe pero la red bloquea la conexión directa
    net.joinTimer=setTimeout(()=>{if(net.peer===peer&&!net.connected)netFail(NAT_MSG);},15000);
  });
}
function setupConn(c){
  net.conn=c;
  c.on('open',()=>{if(net.conn!==c)return;net.connected=true;net.lastRecv=performance.now();clearTimeout(net.joinTimer);
    net.myReady=net.peerReady=false;send({t:'hello',v:NET_V,ship:shipIdx,up:getUpg(shipIdx),un:openShips()});if(net.role==='host')send({t:'gal',l:net.startLv,c:net.startCamp});setPhase('lobby');state='online';sfx('pow');});
  c.on('data',d=>{if(net.conn===c)onData(d);});
  c.on('close',()=>{if(net.conn===c)netFail('e.lost');});
  c.on('error',()=>{if(net.conn===c)netFail('e.lost');});
}
function onData(d){
  net.lastRecv=performance.now();
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case'hello':if(d.v!==NET_V)return netFail('e.version');net.peerShip=fixPeerShip(d);net.peerUp=cleanUp(d.up);break;
    case'ship':net.peerShip=fixPeerShip(d);net.peerUp=cleanUp(d.up);break;
    case'gal':if(net.role==='guest'){net.startCamp=d.c==='sol'?'sol':'gal';net.startLv=Math.max(1,Math.min(CAMPS[net.startCamp].length,d.l|0));}break;
    case'sup':if(mode==='host')activateSuper(players[1]);break;
    case'ready':net.peerReady=!!d.r;maybeStart();break;
    case'full':netFail('e.full');break;
    case'bye':netFail(state==='play'||state==='over'||state==='win'||state==='secret'?'p.left':'e.leftRoom');break;
    case'start':pmenu=null;if(net.role==='guest'){mode='guest';demo=false;net.ups=d.ups||[];reset(d.ships,d.ups,d.lv,d.cp);state='play';net.snaps=[];net.renderF=0;}break;
    case'lobby':if(net.role==='guest'){mode='solo';state='online';net.myReady=net.peerReady=false;setPhase('lobby');}break;
    case's':if(mode==='guest'){net.snaps.push(d);if(net.snaps.length>30)net.snaps.splice(0,net.snaps.length-30);for(const e of d.ev||[])playEv(e);}break;
    case'i':if(mode==='host')net.remote=d;break;
  }
}
function toggleReady(){net.myReady=!net.myReady;send({t:'ready',r:net.myReady});sfx('ui');maybeStart();}
function maybeStart(){
  if(net.role!=='host'||!net.myReady||!net.peerReady||state!=='online')return;
  mode='host';demo=false;const ships=[shipIdx,net.peerShip],ups=[getUpg(shipIdx),net.peerUp];reset(ships,ups,net.startLv,net.startCamp);state='play';net.remote=null;
  send({t:'start',ships,ups,lv:net.startLv,cp:net.startCamp});
}
function startList(){const l=[];for(let i=1;i<=mapP.u;i++)l.push(['gal',i]);for(let i=1;i<=mapS.u;i++)l.push(['sol',i]);return l;}
function hostGal(d){if(net.role!=='host')return;const l=startList(),n=l.length;let k=l.findIndex(q=>q[0]===net.startCamp&&q[1]===net.startLv);if(k<0)k=0;
  [net.startCamp,net.startLv]=l[(k+d+n)%n];send({t:'gal',l:net.startLv,c:net.startCamp});sfx('ui');}
function rematch(){if(net.role!=='host')return;send({t:'lobby'});mode='solo';state='online';net.myReady=net.peerReady=false;setPhase('lobby');}
setInterval(()=>{ // heartbeat + timeout
  if(!net.connected)return;
  send({t:'p'});
  if(performance.now()-net.lastRecv>8000)netFail('e.timeout');
},1000);
addEventListener('beforeunload',()=>{if(net.connected)send({t:'bye'});});

// ---- host: snapshot of the whole match (~30 por segundo) ----
const r1=v=>Math.round(v*10)/10;
const idOf=o=>o.id||(o.id=++nid);
function sendSnapshot(){
  const kind=b=>b.homing?3:b.buddy?4:b.fat?2:b.thin?1:0;
  send({t:'s',f:frame,st:state,lv:level,sg:stage,bg:bgLevel,sh:r1(shake),fl:flash,en:ending,sf:secretFight?1:0,sl:slowT,
    P:players.map(p=>[r1(p.x),r1(p.y),r1(p.tilt),p.lives,p.score,p.kills,p.power,p.shield,p.inv,p.alive?1:0,p.ship,p.combo,p.buddy?r1(p.buddy.x):0,p.buddy?r1(p.buddy.y):0,Math.floor(p.sp),p.supT,p.cry]),
    W:waves.map(w=>[r1(w.x),r1(w.y),r1(w.r),w.o]),
    E:enemies.map(e=>[idOf(e),TCODE[e.type],r1(e.x),r1(e.y),e.hp,e.max,e.hitT,e.t,e.lvl||0,e.v|0,e.fuse|0]),
    B:bullets.map(b=>[idOf(b),r1(b.x),r1(b.y),kind(b),b.o|0,r1(b.vx),r1(b.vy)]),
    Q:eBullets.map(b=>[idOf(b),r1(b.x),r1(b.y),b.k|0]),
    K:pickups.map(k=>[idOf(k),r1(k.x),r1(k.y),k.k,k.t]),
    ev:netEv});
  netEv=[];
}
// ---- guest: replay host events + interpolate between snapshots ----
function playEv(e){
  if(e[0]==='b')burst(e[1],e[2],e[3],e[4],e[5]);
  else if(e[0]==='f')floaters.push({x:e[1],y:e[2],t:e[3],s:e[4],c:e[5],big:e[6]||0,sz:e[7]||0,pop:e[8]||0,t0:e[3]});
  else if(e[0]==='X'){secret.u=1;if(e[1]==='A')secret.a=1;if(e[1]==='B')secret.b=1;saveSecret();}
  else if(e[0]==='s')sfx(e[1]);
  else if(e[0]==='c'){if(e[1]===1){addCrystals(e[2]);missionAdd('cry',e[2]);}}
  else if(e[0]==='L'){const q=(e[2]||[])[1];if(q)markLevel(e[1],q[0],q[1],e[3]);}
  else if(e[0]==='k')parts.push({x:e[1],y:e[2],vx:Math.random()*2-1,vy:-Math.random()*2,life:10,max:10,col:'#fff',sz:2});
}
function guestTick(){
  const me=players[1];
  if(state==='play'&&me&&me.alive){
    const S=SH(me),inp=localInput(me);
    const ac=accelOf(me)*envForces(me);me.vx+=inp.x*ac;me.vy+=inp.y*ac;me.vx*=.82;me.vy*=.82;me.x+=me.vx;me.y+=me.vy;
    me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(40,Math.min(H-24,me.y));me.tilt+=(me.vx*.06-me.tilt)*.3;
    if(me.buddy){const b=me.buddy;if(me.supT>0){b.x+=(me.x-b.x)*.25;b.y+=(me.y-b.y)*.25;}else{if(me.x<70)b.side=1;else if(me.x>W-70)b.side=-1;b.x+=(me.x+b.side*36-b.x)*.14;b.y+=(me.y+14+Math.sin(frame*.09)*4-b.y)*.14;}}
    if(frame%2===0)send({t:'i',x:r1(me.x),y:r1(me.y),tl:r1(me.tilt)});
  }
  const sn=net.snaps;
  if(sn.length){
    const last=sn[sn.length-1],tgt=last.f-5;
    if(!net.renderF||Math.abs(net.renderF-tgt)>45)net.renderF=tgt;else net.renderF+=1+(tgt-net.renderF)*.06;
    let i=sn.length-1;while(i>0&&sn[i-1].f>net.renderF)i--;
    const s1=sn[i],s0=i>0?sn[i-1]:s1,a=s1.f>s0.f?Math.max(0,Math.min(1,(net.renderF-s0.f)/(s1.f-s0.f))):1;
    if(i>2)sn.splice(0,i-2);
    const L=(v0,v1)=>v0+(v1-v0)*a;
    const lerpList=(l1,l0,mk)=>{const m=new Map();for(const o of l0)m.set(o[0],o);return l1.map(o=>{const p=m.get(o[0])||o;return mk(o,L(p[1],o[1]),L(p[2],o[2]));});};
    enemies=lerpList(s1.E.map(e=>[e[0],e[2],e[3],e]),s0.E.map(e=>[e[0],e[2],e[3]]),(o,x,y)=>{const e=o[3],tn=TNAME[e[1]];return{id:e[0],type:tn,x,y,r:TYPES[tn].r*(e[9]===2?.6:1),col:TYPES[tn].col,hp:e[4],max:e[5],hitT:e[6],t:e[7],lvl:e[8],v:e[9],fuse:e[10]};});
    bullets=lerpList(s1.B,s0.B,(o,x,y)=>({x,y,homing:o[3]===3,buddy:o[3]===4,fat:o[3]===2,thin:o[3]===1,o:o[4],vx:o[5],vy:o[6]}));
    eBullets=lerpList(s1.Q,s0.Q,(o,x,y)=>({x,y,k:o[3]|0}));
    pickups=lerpList(s1.K,s0.K,(o,x,y)=>({x,y,k:o[3],t:o[4]}));
    s1.P.forEach((q,j)=>{
      let p=players[j];if(!p||p.ship!==q[10]){p=players[j]=makePlayer(j,q[10],q[0],(net.ups||[])[j]);}
      const q0=s0.P[j]||q;
      if(j!==1||!p.alive||q[9]===0){p.x=L(q0[0],q[0]);p.y=L(q0[1],q[1]);p.tilt=q[2];if(p.buddy){p.buddy.x=L(q0[12],q[12]);p.buddy.y=L(q0[13],q[13]);}}
      p.lives=q[3];p.score=q[4];p.kills=q[5];p.power=q[6];p.shield=q[7];p.inv=q[8];p.alive=!!q[9];p.combo=q[11];p.sp=q[14]||0;p.supT=q[15]||0;p.cry=q[16]||0;
    });
    player=players[0];
    // latest global state (not interpolated)
    waves=(last.W||[]).map(w=>({x:w[0],y:w[1],r:w[2],o:w[3]}));
    level=last.lv;stage=last.sg;if(last.bg!==bgLevel)setBg(last.bg,false);
    if(last.sh>shake)shake=last.sh;if(last.fl>flash)flash=last.fl;
    ending=last.en||null;secretFight=!!last.sf;slowT=last.sl|0;
    if(last.st!==state&&(last.st==='over'||last.st==='win')){menuFocus=0;if(last.st==='win'){winT=0;}}
    state=last.st;
  }
  updateFx();
}

const keys={};
addEventListener('keydown',e=>{
  initAudio();
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace'].includes(e.code))e.preventDefault();
  if(e.repeat&&state!=='play')return;
  if(e.code==='KeyM'){muted=!muted;toast([muted?'mu.mute':'mu.unmute'],'#7df9ff');return;}
  if(e.code==='KeyN'&&!(state==='online'&&net.phase==='join-input')){toggleMusic();return;}
  const left=e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowUp',right=e.code==='ArrowRight'||e.code==='KeyD'||e.code==='ArrowDown',ok=e.code==='Enter'||e.code==='Space',esc=e.code==='Escape';
  if(state==='play'||state==='pause'){
    if(pmenu){
      if(e.repeat)return;
      const bs=pauseButtons();
      if(left||right){menuFocus=(menuFocus+(right?1:-1)+bs.length)%bs.length;sfx('ui');}
      else if(e.code==='Enter'||e.code==='Space')(bs[menuFocus]||bs[0]).act();
      else if(esc||e.code==='KeyP'){if(pmenu==='confirm'){pmenu='menu';menuFocus=0;}else closePause();}
      return;
    }
    if(state==='play'&&['Space','ShiftLeft','ShiftRight','KeyE'].includes(e.code)){if(!e.repeat)trySuper();return;}
    if((e.code==='KeyP'||esc)&&!e.repeat)openPause();
    return;
  }
  if(state==='map'){
    const mh=e.code==='ArrowLeft'||e.code==='KeyA'?-1:e.code==='ArrowRight'||e.code==='KeyD'?1:0;
    if(mh)mapPick(msel[mapTab]+mh);
    else if(['ArrowUp','ArrowDown','KeyW','KeyS','Tab'].includes(e.code)){e.preventDefault();mapSetTab(mapTab==='gal'?'sol':'gal');}
    else if(/^Digit[1-9]$/.test(e.code)&&+e.code.slice(5)<=CAMPS[mapTab].length)mapPick(+e.code.slice(5)-1);
    else if(ok)mapLaunch();else if(e.code==='KeyH')openHangar('map');
    else if(esc||e.code==='Backspace')toTitle();
    return;
  }
  if(state==='hangar'){
    if(e.code==='ArrowLeft'||e.code==='KeyA')pickShip(hangarSel-1);
    else if(e.code==='ArrowRight'||e.code==='KeyD')pickShip(hangarSel+1);
    else if(/^Digit[1-9]$/.test(e.code)&&+e.code.slice(5)<=SHIPS.length)pickShip(+e.code.slice(5)-1);
    else if(e.code==='ArrowUp'||e.code==='KeyW'){upSel=(upSel+3)%4;sfx('ui');}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){upSel=(upSel+1)%4;sfx('ui');}
    else if(e.code==='KeyU')buyUpgrade(upSel);
    else if(ok)launch();
    else if(esc||e.code==='Backspace')hangarBack();
    return;
  }
  if(state==='online'&&net.phase==='join-input'){
    if(/^Key[A-Z]$/.test(e.code))typeCode(e.code.slice(3));
    else if(e.code==='Backspace')typeCode('⌫');
    else if(e.code==='Enter')tryJoin();
    else if(esc)openOnline();
    return;
  }
  if(langOpen){
    if(left||right){langFocus=(langFocus+(right?1:-1)+LANGS.length)%LANGS.length;sfx('ui');}
    else if(ok)langList()[langFocus].act();
    else if(esc||e.code==='KeyI')langOpen=false;
    return;}
  if(langBtnOn()&&e.code==='KeyI')return openLang();
  const bs=menuButtons();if(!bs.length)return;
  if(left||right){menuFocus=(menuFocus+(right?1:-1)+bs.length)%bs.length;sfx('ui');return;}
  if(state==='title'&&e.code==='KeyH')return openHangar('solo');
  if(state==='title'&&e.code==='KeyL')return openOnline();
  if(state==='title'&&e.code==='KeyK')return openMissions();
  if(state==='missions'&&(esc||e.code==='Backspace'))return toTitle();
  if(state==='missions'&&e.code==='KeyG')return openMap();
  if(state==='secret'&&esc)return skipSecret();
  if((state==='title'||((state==='over'||state==='win')&&mode==='solo'))&&e.code==='KeyG')return openMap();
  if(state==='online'&&net.phase==='lobby'&&e.code==='KeyG')return hostGal(1);
  if((state==='over'||state==='win')&&mode==='solo'&&e.code==='KeyH')return openHangar('solo');
  if(state==='online'&&net.phase==='lobby'&&e.code==='KeyH')return openHangar('mp');
  if(esc){
    if(state==='online'){if(net.phase==='menu'||net.phase==='error')return net.phase==='menu'?toTitle():openOnline();if(net.phase==='lobby')return netLeave();return bs[bs.length-1].act();}
    if((state==='over'||state==='win')&&mode!=='solo')return netLeave();
  }
  if(ok){(bs[menuFocus]||bs[0]).act();}

function tpos(e){const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height};}
const inside=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
cv.addEventListener('pointerdown',e=>{
  initAudio();const pt=tpos(e);
  if(state==='play'||state==='pause'){
    if(pmenu){for(const b of pauseButtons())if(inside(pt,b)){b.act();return;}if(state==='pause')return;}
    else if(pauseBtnOn()&&inside(pt,{x:PAUSEB.x-6,y:PAUSEB.y-6,w:PAUSEB.w+12,h:PAUSEB.h+12})){openPause();return;}
    if(state!=='play')return;
    if(Math.hypot(pt.x-SUPB.x,pt.y-SUPB.y)<SUPB.r+8&&myPlayer()&&myPlayer().alive){trySuper();return;}touch=pt;return;}
  if(state==='map'){for(const tb of MAPTAB)if(inside(pt,tb)){if(tb.t!==mapTab)mapSetTab(tb.t);return;}
    const N=mapNodes(mapTab),rr=mapTab==='sol'?34:40;for(let i=0;i<N.length;i++)if(Math.hypot(pt.x-N[i].x,pt.y-N[i].y)<rr){if(i===msel[mapTab])mapLaunch();else mapPick(i);return;}}
  if(langOpen){for(const b of langList())if(inside(pt,b)){b.act();return;}langOpen=false;return;}
  if(langBtnOn()&&inside(pt,LANGB)){openLang();return;}

  if(state==='hangar'){for(let i=0;i<SHIPS.length;i++)if(inside(pt,cardRect(i))){if(i===hangarSel)launch();else pickShip(i);return;}}
  for(const b of menuButtons())if(inside(pt,b)){b.act();return;}
});
cv.addEventListener('pointermove',e=>{

  if(langOpen){langList().forEach((b,i)=>{if(inside(pt,b))langFocus=i;});return;}
  if(state!=='play'&&state!=='hangar'&&state!=='map'){menuButtons().forEach((b,i)=>{if(!b.key&&inside(pt,b))menuFocus=i;});}
});

function localInput(p){
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.KeyA)ix-=1;if(keys.ArrowRight||keys.KeyD)ix+=1;
  if(keys.ArrowUp||keys.KeyW)iy-=1;if(keys.ArrowDown||keys.KeyS)iy+=1;
  if(touch){const dx=touch.x-p.x,dy=(touch.y-60)-p.y;ix=Math.max(-1,Math.min(1,dx/25));iy=Math.max(-1,Math.min(1,dy/25));}
  return{x:ix,y:iy};
}

function hurtEnemy(e,dmg,o){if(e.hp<=0)return;e.hp-=dmg;e.hitT=3;e.lastHit=o;}
function superStep(p,S){
  const K=S.superKind,o=p.id,t=SUP_T-p.supT,dm=dmgMul(p);
  if(K==='pulse'){if(t>0&&t%55===0)waves.push({x:p.x,y:p.y,r:10,o,hit:new Set()});}
  else if(K==='storm'){if(frame%3===0){for(const d of [-18,-9,0,9,18])bullets.push({x:p.x+d,y:p.y-18,vx:d*.06+R(-.6,.6),vy:-15,dmg:1,thin:1,o});if(frame%6===0)sfx('shoot');}}
  else if(K==='fortress'){
    if(frame%7===0){const n=13;for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.17;bullets.push({x:p.x,y:p.y-16,vx:Math.sin(a)*10,vy:-Math.cos(a)*10,dmg:2,fat:1,o});}sfx('shoot');}
    for(const e of enemies)if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r+40)hurtEnemy(e,(isBoss(e)?.05:.3)*dm,o);
  }else if(K==='rain'){
    if(frame%4===0)bullets.push({x:R(20,W-20),y:-10,vx:R(-1,1),vy:7.5,dmg:3,homing:1,life:150,o});
    if(frame%12===0){for(const sd of [-1,1])bullets.push({x:p.x+sd*12,y:p.y-8,vx:sd*5,vy:-4,dmg:3,homing:1,life:120,o});sfx('missile');}
  }else if(K==='fusion'){
    if(frame%4===0){for(const d of [-26,-16,-6,6,16,26])bullets.push({x:p.x+d,y:p.y-30,vx:d*.03,vy:-14,dmg:1.5,o});sfx('shoot');}
    for(const e of enemies)if(e.y<p.y&&Math.abs(e.x-p.x)<24+e.r*.6)hurtEnemy(e,.35*dm,o);
    if(frame%2===0)parts.push({x:p.x+R(-14,14),y:p.y-40-R(0,300),vx:0,vy:-3,life:14,max:14,col:rnd()<.5?'#ffffff':'#ff8fd0',sz:3});
  }
}
function updateWaves(){
  for(const w of waves){w.r+=14;const p=players[w.o]||players[0];
    for(const e of enemies){if(w.hit.has(e))continue;const d=Math.hypot(e.x-w.x,e.y-w.y);if(d<w.r+e.r){w.hit.add(e);hurtEnemy(e,6*dmgMul(p),w.o);burst(e.x,e.y,'#7df9ff',8,3);}}

function nearestP(x,y){let t=null,bd=1e9;for(const p of players){if(!p.alive)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;t=p;}}return t;}
function ebul(e,x,y,vx,vy){eBullets.push({x,y,vx,vy,k:(TYPES[e.type]||{}).bk|0});}
function aimed(e,n,spread,sp){const p=nearestP(e.x,e.y);if(!p)return;const a0=Math.atan2(p.y-e.y,p.x-e.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*spread;ebul(e,e.x,e.y+20,Math.cos(a)*sp,Math.sin(a)*sp);}}
function ringShot(e,n,sp,off){for(let i=0;i<n;i++){const a=off+i/n*6.283;ebul(e,e.x,e.y,Math.cos(a)*sp,Math.sin(a)*sp);}}
function spiralShot(e,arms,sp){const a=e.t*.09;for(let k=0;k<arms;k++){const aa=a+k*6.283/arms;ebul(e,e.x,e.y+20,Math.cos(aa)*sp,Math.abs(Math.sin(aa))*sp+1);}}
const countType=t=>enemies.reduce((n,q)=>n+(q.type===t&&!q.dead?1:0),0);
function enemyAI(e,T){
  switch(T.ai){
  case'drone':e.y+=e.vy;e.x+=Math.sin((e.t+e.phase*20)*.04)*1.6;break;
  case'zig':e.y+=e.vy;e.x+=Math.sin((e.t+e.phase*15)*.09)*3.4;if(e.t%90===40&&e.y>0)shootAt(e,3.2);break;
  case'tank':e.y+=e.vy*.6;if(e.t%70===30&&e.y>0){for(let a=-1;a<=1;a++)ebul(e,e.x,e.y+18,a*1.4,3);}break;
  case'boss':bossAI(e,T);break;
  case'darter': // baja despacio, apunta y se lanza en picada
    if(!e.dash){e.y+=e.vy*1.1;e.x+=Math.sin(e.t*.1+e.phase)*1.2;
      if(e.y>30&&e.t%90===((e.phase*17|0)%50)+20){const p=nearestP(e.x,e.y);if(p){const a=Math.atan2(p.y-e.y,p.x-e.x);e.dvx=Math.cos(a)*7.5;e.dvy=Math.sin(a)*7.5;e.dash=1;e.dt=0;}}}
    else{e.x+=e.dvx;e.y+=e.dvy;if(++e.dt>28)e.dash=0;}
    break;
  case'acid': // nube que baja lenta y frena a quien entre en ella
    e.y+=e.y<60?e.vy:.38;e.x+=Math.sin(e.t*.02+e.phase)*1.1;if(e.t%85===40&&e.y>0)ebul(e,e.x,e.y+e.r,R(-.5,.5),2.1);break;
  case'swarm':{const p=nearestP(e.x,e.y);e.y+=e.vy;if(p){e.vx+=Math.sign(p.x-e.x)*.2;e.vx*=.93;}e.x+=e.vx+Math.sin(e.t*.3+e.phase)*1.3;break;}
  case'snake':{ // cada segmento sigue el mismo camino con retraso
    const tt=e.t-e.k*9;if(tt<0){e.y=-60;break;}
    e.x=e.x0+Math.sin(tt*.035+e.phase)*170;e.y=((tt*e.vy*.8)%(H+80))-40;
    if(e.k===0&&tt%100===50&&e.y>0)shootAt(e,3);break;}
  case'vortex': // remolino: se queda arriba, atrae naves y suelta enemigos
    if(e.y<e.ty)e.y+=1.2;e.x+=Math.sin(e.t*.015+e.phase)*1.3;
    if(e.t%150===75&&e.y>0&&enemies.length<26){spawn(T.minion,e.x,e.y+12,{vy:1.7,phase:rnd()*4});burst(e.x,e.y,T.col,10,3);}
    if(e.t%120===20&&e.y>0)ringShot(e,8,2.2,e.t*.1);break;
  case'ringer': // gira en grupo alrededor de un centro que baja
    e.cy+=.55;if(e.cy>H+50)e.cy=-60;e.ang+=.032*e.dir;e.x=e.cx+Math.cos(e.ang)*e.rad;e.y=e.cy+Math.sin(e.ang)*e.rad*.45;
    if(e.t%110===55&&e.y>0)shootAt(e,2.8);break;
  case'shard':e.y+=e.vy;e.x+=Math.sin(e.t*.05+e.phase)*2.2;if(!e.v&&e.t%120===60&&e.y>0)shootAt(e,3);break;
  case'pusher':e.y+=e.y<e.ty?1:.15;e.x+=Math.sin(e.t*.012+e.phase)*1.6;if(e.t%100===50&&e.y>0)shootAt(e,2.6);break;
  case'flare': // llamarada: baja, parpadea y estalla en 10 balas
    e.y+=e.y<e.ty?e.vy:.2;e.x+=Math.sin(e.t*.07+e.phase)*1.5;
    if(e.y>=e.ty){e.fuse=(e.fuse||0)+1;if(e.fuse>50){ringShot(e,10,2.5,rnd()*6);burst(e.x,e.y,T.col,24,5);sfx('boom');e.dead=1;}}break;
  }
}
function bossAI(e,T){
  const st=T.style,L=e.lvl||1,t=e.t;
  if(e.y<110)e.y+=e.vy;else e.x=W/2+Math.sin(t*(st==='dash'?.026:.012))*(st==='dash'?265:230);
  if(e.y<100)return;
  switch(st){
  case'classic':{const rate=Math.max(7,14-L);if(t%rate===0)spiralShot(e,L>=4?4:3,2.6);if(L>=2&&t%60===0)for(let k=-2;k<=2;k++)ebul(e,e.x+k*20,e.y+40,k*.5,4);break;}
  case'dash':if(t%13===0)spiralShot(e,3,2.4);if(t%45===0)aimed(e,3,.2,4);break;
  case'acid':if(t%50===0)for(let i=0;i<7;i++){const a=Math.PI/2+(i-3)*.22;ebul(e,e.x,e.y+30,Math.cos(a)*1.9,Math.sin(a)*1.9);}
    if(t%15===0)spiralShot(e,2,2.2);if(t%360===180&&countType('ven_b')<2)spawn('ven_b',e.x,e.y+40,{vy:1.4,phase:rnd()*6});break;
  case'summon':if(t%11===0)spiralShot(e,3,2.5);if(t%200===100&&enemies.length<20)for(let i=0;i<4;i++)spawn('ear_b',e.x+(i-1.5)*30,e.y+30,{vy:1.8,phase:rnd()*6});break;
  case'spiral4':if(t%9===0)spiralShot(e,4,2.7);if(t%60===0)aimed(e,5,.18,3.6);break;
  case'storm':if(t%12===0)spiralShot(e,5,2.2);if(t%300===150&&countType('jup_b')<1)spawn('jup_b',R(120,W-120),-30,{ty:R(90,170),phase:rnd()*6});break;
  case'rings':if(t%70===0)ringShot(e,18,2.4,t*.05);if(t%140===70)aimed(e,5,.15,3.8);if(t%10===0&&t%140>100)spiralShot(e,2,2.6);break;
  case'ice':if(t%55===0)aimed(e,5,.22,3.6);if(t%13===0)spiralShot(e,3,2.3);if(t%300===150&&countType('ura_b')<3)for(const s of [-1,1])spawn('ura_b',e.x+s*40,e.y+30,{vy:1.4,phase:rnd()*6});break;
  case'wind':if(t%90===0){const gap=(rnd()*7)|0;for(let i=0;i<9;i++)if(i!==gap&&i!==gap+1)ebul(e,40+i*80,e.y+30,0,2.4);}if(t%15===0)spiralShot(e,3,2.3);break;
  case'dark':{const f=e.hp/e.max;e.y=140+Math.sin(t*.021)*30;e.x=W/2+Math.sin(t*.0105)*230;
    if(t%9===0)spiralShot(e,f<.33?4:3,2.3);
    if(f>.66){if(t%72===0)ringShot(e,16,2.2,t*.03);}
    else if(f>.33){if(t%52===0)aimed(e,7,.14,3.4);if(t%240===120&&countType('dark_a')<4)for(const s of [-1,1])spawn('dark_a',e.x+s*70,e.y+20,{vy:1.4,phase:rnd()*6});}
    else{if(t%46===0)ringShot(e,22,2.5,(t/46%2)*.14);if(t%200===100&&countType('dark_a')<5)for(const s of [-1,0,1])spawn('dark_a',e.x+s*80,e.y+20,{vy:1.4,phase:rnd()*6});}
    break;}
  case'sun':if(t%60===0)ringShot(e,20,2.3,t*.07);if(t%11===0)spiralShot(e,4,2.5);if(t%220===110&&countType('sun_b')<3)for(const s of [-1,1])spawn('sun_b',e.x+s*60,e.y+30,{vy:1.7,phase:rnd()*6,ty:R(H*.35,H*.6)});break;
  }
}
// fuerzas especiales sobre una nave: nubes ácidas frenan, sopladores y viento empujan, vórtices atraen
function envForces(p){
  let slow=1;
  for(const e of enemies){const T=TYPES[e.type];if(!T||e.y<-20)continue;
    if(T.ai==='acid'||T.style==='acid'){if(Math.hypot(p.x-e.x,p.y-e.y)<(T.ai==='acid'?ACID_R:115))slow=.45;}
    else if(T.ai==='pusher'){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(d<230){const f=.55*(1-d/230);p.vx+=dx/d*f;p.vy+=dy/d*f;}}
    else if(T.ai==='vortex'){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d<180&&d>24){const f=.32*(1-d/180);p.vx+=dx/d*f;p.vy+=dy/d*f;}}
    else if(T.style==='wind'&&e.y>=100)p.vx+=Math.sin(e.t*.012)*.28;
    else if(T.style==='dark'&&e.y>=100&&e.max&&e.hp/e.max<.33){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d<440&&d>40){const f=.2*(1-d/440);p.vx+=dx/d*f;p.vy+=dy/d*f;}} // agujero negro: atrae
  }
  p.slowed=slow<1;return slow;
}
function spawnSolarWave(g){
  const [ta,tb]=SOLAR[level-1].enemies,TB=TYPES[tb],v=1.15+g*.05,cols=6;
  const n=Math.min(4+Math.round(g*1.3),14)+(TYPES[ta].big?-4:0);
  for(let i=0;i<n;i++){const c=i%cols,row=(i/cols)|0;spawn(ta,W/2+(c-(cols-1)/2)*95+(row%2)*30,-30-row*60,{vy:v,phase:row+c*.3});}
  const s2=stage>1?1:0;
  switch(TB.ai){
  case'darter':for(let i=0;i<3+s2*2;i++)spawn(tb,R(60,W-60),-60-i*70,{vy:1.3,phase:rnd()*6});break;
  case'acid':for(let i=0;i<2+s2;i++)spawn(tb,120+i*(W-240)/Math.max(1,1+s2),-50-i*60,{vy:1.3,phase:rnd()*6});break;
  case'swarm':for(let gI=0;gI<2+s2;gI++){const x=R(100,W-100);for(let i=0;i<5;i++)spawn(tb,x+(i-2)*16,-40-gI*120-i*12,{vy:1.5+g*.02,phase:rnd()*6});}break;
  case'snake':for(let sI=0;sI<1+s2;sI++){const x0=sI?W*.7:W*.3;for(let k=0;k<7;k++)spawn(tb,x0,-60,{k,x0,v:k===0?1:0,vy:1.6+g*.02,phase:sI*2});}break;
  case'vortex':for(let i=0;i<1+s2;i++)spawn(tb,s2?(i?W*.72:W*.28):W/2,-40,{ty:R(90,150),phase:rnd()*6});break;
  case'ringer':for(let gI=0;gI<1+s2;gI++){const cx=s2?(gI?W*.7:W*.3):W/2,dir=gI?-1:1;for(let i=0;i<5;i++)spawn(tb,cx,-60,{cx,cy:-70-gI*60,rad:85,ang:i/5*6.283,dir});}break;
  case'shard':for(let i=0;i<3+s2;i++)spawn(tb,R(80,W-80),-50-i*65,{vy:1.25+g*.03,phase:rnd()*6});break;
  case'pusher':for(let i=0;i<1+s2;i++)spawn(tb,s2?(i?W*.75:W*.25):W/2,-40,{ty:R(110,170),phase:rnd()*6});break;
  case'flare':for(let i=0;i<3+s2;i++)spawn(tb,R(80,W-80),-50-i*70,{vy:1.6,phase:rnd()*6,ty:R(H*.3,H*.62)});break;
  }
}
function spawn(type,x,y,o={}){const T=TYPES[type];enemies.push(Object.assign({type,x,y,r:T.r,hp:T.hp,max:T.hp,t:0,col:T.col,hitT:0,vx:0,vy:1.6},o));}
function addFloat(f){f.t0=f.t;floaters.push(f);rec(f.pop||f.sz?['f',r1(f.x),r1(f.y),f.t,f.s,f.c,f.big||0,f.sz||0,f.pop||0]:['f',r1(f.x),r1(f.y),f.t,f.s,f.c,f.big||0]);}
function banner(s,c,t=110,dy=-40,size=34){addFloat({x:W/2,y:H/2+dy,t,s,c,big:size});}
function alivePlayers(){return players.filter(p=>p.alive);}
// advance to the next stage: 2 waves + boss per level, 6 levels
function nextStage(){
  if(stage===STAGES){
    if(level>=CAMPS[camp].length){endCampaign();return;}
    level++;stage=0;setBg(bgi(camp,level),false);
  }
  stage++;wave++;
  const LV=CAMPS[camp],g=camp==='sol'?Math.ceil(wave*2/3):wave; // dificultad global (1..18)
  if(stage===1)for(const p of players){p.ls=p.score;p.lh=0;}
  for(const p of alivePlayers()){if(SH(p).special==='waveShield')p.shield=Math.max(p.shield,240);if(p.up[3])p.shield=Math.max(p.shield,60*p.up[3]);}
  if(stage===1){banner(['g.level',level],'#ffffff',170,-76,40);banner(['@lv',camp,level],LV[level-1].grid,170,-38,26);banner(['g.enemies',levelEnemies(camp,level).join(', ')],'#ffffffcc',170,-8,15);}
  stageActive=true;
  if(stage===STAGES){
    const bt=camp==='sol'?SOLAR[level-1].enemies[2]:'boss',le=camp==='sol'?Math.round(1+(level-1)*5/8):level;
    spawn(bt,W/2,-80,{vy:1.6,lvl:level});const b=enemies[enemies.length-1];b.hp=b.max=(60+le*30)*(players.length>1?1.5:1)|0;boss=b;
    banner(['g.alert'],'#ff5e3a',120,-14,30);banner(bossName(b),TYPES[bt].col,120,22,22);return;
  }
  if(stage>1)banner(['g.wave',stage,STAGES-1],LV[level-1].grid,90,-40,30);
  if(camp==='sol'){spawnSolarWave(g);return;}
  const n=Math.min(5+g*2,22),pattern=(level+stage)%3,cols=6;
  for(let i=0;i<n;i++){
    const c=i%cols,row=(i/cols)|0,x=W/2+(c-(cols-1)/2)*95,y=-30-row*60;
    if(pattern===1)spawn('drone',x,y,{vy:1.3+g*.06,phase:row});
    else if(pattern===2)spawn(c%3===1?'zig':'drone',x+(row%2)*40,y,{vy:1.3+g*.05,phase:row});
    else spawn(i%6===2?'tank':(i%2?'zig':'drone'),x,y,{vy:1.1+g*.045,phase:row});
  }
}
function stageCleared(){
  stageActive=false;
  // corazón: aparece al completar cada oleada
  pickups.push({x:R(90,W-90),y:-16,k:'H',t:0});
  waveTimer=stage===STAGES?150:110;
}
function levelComplete(L){
  banner(['g.done'],'#ffd23f',130,40,24);
  if(mode==='solo'&&demo)return;
  const pr=players.map(p=>[p.score-p.ls,p.lh]);

}
function gainCrystals(p,n){p.cry+=n;if(mode==='solo'&&demo)return;if(p.id===0){addCrystals(n);missionAdd('cry',n);}else rec(['c',p.id,n]);}
// ---------- final de la campaña del Sistema Solar: jefe secreto y finales A / B ----------
function secretEligible(){if(secret.u)return true;let sc=0,cr=0;for(const p of players){sc+=p.score;cr+=p.cry;}return sc>=SECRET.score||cr>=SECRET.crystals;}
function endCampaign(){
  if(camp!=='sol'||(mode==='solo'&&demo)){ending=null;winGame();return;}
  if(secretFight){ending='A';winGame();return;}
  const el=secretEligible();secretOffered=el;
  if(!secret.u){secret.u=1;saveSecret();rec(['X','U']);}
  if(el){state='secret';menuFocus=0;pmenu=null;flash=16;shake=12;sfx('big');return;}
  ending='B';winGame();
}
function startSecret(){if(state!=='secret'||mode==='guest')return;
  state='play';secretFight=true;stage=STAGES;stageActive=true;enemies=[];eBullets=[];pickups=pickups.filter(k=>k.k==='C');setBg(SECRET_BGI,false);
  for(const p of alivePlayers())p.shield=Math.max(p.shield,200);
  spawn('dark_boss',W/2,-90,{vy:1.3,lvl:level});const b=enemies[enemies.length-1];b.hp=b.max=SECRET.hp*(players.length>1?1.5:1)|0;boss=b;
  banner(['s.alert'],'#b44dff',150,-14,30);banner(bossName(b),'#ff4dd2',150,22,24);sfx('super');shake=22;flash=10;}
function skipSecret(){if(state!=='secret'||mode==='guest')return;ending='B';winGame();}

function dropCrystals(x,y,n,spray){for(let i=0;i<n;i++){const a=rnd()*6.283,v=spray?R(2,6):R(.5,1.5);pickups.push({x,y,k:'C',t:(rnd()*60)|0,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1});}}
function winGame(){state='win';winT=0;menuFocus=0;flash=20;sfx('win');pmenu=null;
  if(ending&&!(mode==='solo'&&demo)){if(ending==='A'){secret.a=1;for(const p of players)gainCrystals(p,SECRET.rewardA);}else secret.b=1;secret.u=1;saveSecret();rec(['X',ending]);}
  if(mode==='solo'){const sc=players[0].score;if(sc>hi){hi=sc;save('neonDriftHi',hi);}if(demo)toTitle();}}

function burst(x,y,col,n=18,sp=4){rec(['b',r1(x),r1(y),col,n,sp]);
  if(n>=18&&rings.length<20)rings.push({x,y,r:sp*2,v:sp*1.8,life:22,max:22,col});
  const m=parts.length>1100?Math.ceil(n*.35):n; // límite de partículas para móviles
  for(let i=0;i<m;i++){const a=rnd()*6.283,k=i%4===0,s=R(.5,sp)*(k?1.7:1);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:R(20,45),max:45,col:i%6===0?'#ffffff':col,sz:R(1.5,3.5),k:k?1:0});}}

// ---------- ship weapons ----------
function fireWeapon(p,S){
  const lv=Math.min(p.power,4),o=p.id;
  if(S.fire==='spread'){
    const spreads=[[0],[-6,6],[-10,0,10],[-14,-5,5,14]][lv-1];
    for(const d of spreads)bullets.push({x:p.x+d,y:p.y-16,vx:d*.04,vy:-11,dmg:1,o});
    sfx('shoot');
  }else if(S.fire==='rapid'){
    p.alt=!p.alt;
    const sets=[[p.alt?-4:4],[-5,5],[-9,0,9],[-12,-4,4,12]][lv-1];
    for(const d of sets)bullets.push({x:p.x+d,y:p.y-20,vx:0,vy:-14,dmg:1,thin:1,o});
    sfx('shoot');
  }else if(S.fire==='fan'){
    const n=[3,5,7,9][lv-1];
    for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.13;bullets.push({x:p.x,y:p.y-14,vx:Math.sin(a)*9,vy:-Math.cos(a)*9,dmg:1,fat:1,o});}
    sfx('shoot');
  }else if(S.fire==='homing'){
    const n=[1,1,2,2][lv-1];
    for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*.45;bullets.push({x:p.x,y:p.y-8,vx:Math.cos(a)*6,vy:Math.sin(a)*6,dmg:2,homing:1,life:110,o});}
    sfx('missile');
  }else if(S.fire==='twin'){
    const sets=[[-6,6],[-9,0,9],[-12,-4,4,12],[-14,-7,0,7,14]][lv-1];
    for(const d of sets)bullets.push({x:p.x+d,y:p.y-16,vx:d*.03,vy:-12,dmg:1,o});
    sfx('shoot');
  }
}
function updateBuddy(p,S){
  const b=p.buddy;if(!b)return;
  if(p.supT>0&&S.superKind==='fusion'){b.x+=(p.x-b.x)*.25;b.y+=(p.y-b.y)*.25;return;}
  if(p.x<70)b.side=1;else if(p.x>W-70)b.side=-1;
  const tx=p.x+b.side*36,ty=p.y+14+Math.sin(frame*.09)*4;
  b.x+=(tx-b.x)*.14;b.y+=(ty-b.y)*.14;
  if(--b.cd<=0){b.cd=S.companion.cooldown*cdMul(p);
    bullets.push({x:b.x,y:b.y-10,vx:0,vy:-11,dmg:1,buddy:1,o:p.id});
    if(p.power>=3)bullets.push({x:b.x,y:b.y-10,vx:b.side*1.2,vy:-10.5,dmg:1,buddy:1,o:p.id});}
}
function steerMissile(b){
  let t=null,bd=1e9;
  for(const e of enemies){if(e.hp<=0||e.y<-10)continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;t=e;}}
  let a=Math.atan2(b.vy,b.vx);
  if(t){let da=Math.atan2(t.y-b.y,t.x-b.x)-a;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;a+=Math.max(-.11,Math.min(.11,da));}
  b.vx=Math.cos(a)*7.5;b.vy=Math.sin(a)*7.5;
  if(--b.life<=0)b.dead=1;
  if((frame&1)===0)parts.push({x:b.x,y:b.y,vx:-b.vx*.08,vy:-b.vy*.08,life:14,max:14,col:'#ff9f1c',sz:2});
}

// ---------- demo AI (solo / pantalla de título) ----------
function aiInput(){
  const p=player;let tx=p.x,ty=H-90;
  let best=null,bs=1e9;for(const e of enemies){if(e.y<-20)continue;const s=Math.abs(e.x-p.x)+(H-e.y)*.6;if(s<bs){bs=s;best=e;}}
  if(best)tx=best.x;
  for(const k of pickups){if(k.y>H*.4||(k.k==='H'&&k.y>H*.2&&enemies.length===0)){tx=k.x;ty=Math.min(H-50,Math.max(k.y+10,H*.45));}}
  let dx=0,dy=0;
  for(const b of eBullets){const ddx=p.x-b.x,ddy=p.y-b.y,d=Math.hypot(ddx,ddy);if(d<90&&b.y<p.y+20){dx+=ddx/d*(90-d);dy+=ddy/d*(90-d)*.5;}}
  for(const e of enemies){const ddx=p.x-e.x,ddy=p.y-e.y,d=Math.hypot(ddx,ddy);if(d<e.r+70&&ddy<e.r+90){dx+=ddx/d*(e.r+70-d)*1.5;dy+=ddy/d*(e.r+70-d);}}
  tx+=dx*2.2;ty+=dy*1.5;
  if(p.sp>=100&&enemies.length>3)activateSuper(p);
  return{x:Math.max(-1,Math.min(1,(tx-p.x)/30)),y:Math.max(-1,Math.min(1,(ty-p.y)/30)),fire:true};
}

// ---------- update ----------
function update(){
  frame++;
  if(bgFade<1)bgFade=Math.min(1,bgFade+1/90);
  if(langOpen&&!langBtnOn())langOpen=false;
  for(const s of stars){s.y+=s.z*(state==='play'?3:1.2);if(s.y>H){s.y=0;s.x=R(0,W);}}
  if(toasts.length){for(const t of toasts)t.t--;toasts=toasts.filter(t=>t.t>0);}
  if(hurtT>0)hurtT--;
  if(frame%600===0&&!CAPTURE)dailyCheck();
  if(state==='play'&&!(mode==='solo'&&demo))trackTick();
  if(mode==='guest'){if(state==='play'||state==='over'||state==='win'||state==='secret')guestTick();else updateFx();return;}
  if(hangarMsg&&--hangarMsg.t<=0)hangarMsg=null;
  if(state==='hangar'||state==='online'||state==='map'||state==='missions'||state==='pause'||(state==='title'&&!demo))return;
  if(state==='over'||state==='win'||state==='secret'){updateFx();if(mode==='host'&&frame%2===0)sendSnapshot();return;}
  simulate();
  if(mode==='host'&&frame%2===0)sendSnapshot();
}
function simulate(){
  for(const p of players){
    if(!p.alive)continue;
    const S=SH(p);
    if(mode==='host'&&p.id===1){ // remote player (J2): position comes from the guest
      const r=net.remote;if(r){p.x+=(Math.max(16,Math.min(W-16,r.x))-p.x)*.6;p.y+=(Math.max(40,Math.min(H-24,r.y))-p.y)*.6;p.tilt=r.tl||0;}
    }else{
      const inp=(demo&&mode==='solo')?aiInput():localInput(p),ac=accelOf(p)*envForces(p);
      p.vx+=inp.x*ac;p.vy+=inp.y*ac;p.vx*=.82;p.vy*=.82;p.x+=p.vx;p.y+=p.vy;
      p.x=Math.max(16,Math.min(W-16,p.x));p.y=Math.max(40,Math.min(H-24,p.y));p.tilt+=(p.vx*.06-p.tilt)*.3;
    }
    if(p.inv>0)p.inv--;if(p.shield>0)p.shield--;
    if(p.cd>0)p.cd--;
    if(p.cd<=0&&!dbgHold){p.cd=S.cooldown*cdMul(p);fireWeapon(p,S);} // auto-fire
    if(p.supT>0){p.supT--;superStep(p,S);}
    updateBuddy(p,S);
  }
  const slow=(players.some(p=>p.alive&&p.supT>0&&SH(p).superKind==='storm')?.35:1)*(slowT>0?.3:1);if(slowT>0)slowT--;
  slowAcc+=slow;let steps=0;while(slowAcc>=1){steps++;slowAcc--;}
  if(enemies.length===0){
    if(stageActive)stageCleared();
    else if(--waveTimer<=0){nextStage();if(state!=='play')return;waveTimer=70;}
  }
  for(const e of enemies){
    if(e.hitT>0)e.hitT--;
    for(let st=0;st<steps;st++){
    e.t++;
    enemyAI(e,TYPES[e.type]);
    }
    e.x=Math.max(e.r,Math.min(W-e.r,e.x));
    if(!isBoss(e)&&e.y>H+40){e.y=-40;e.x=R(40,W-40);}
    for(const p of players){if(!p.alive||p.inv>0)continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r-4){hurt(p);if(state!=='play')return;if(!isBoss(e))e.hp=0;}}
  }
  for(const b of bullets){
    if(b.homing)steerMissile(b);
    b.x+=b.vx;b.y+=b.vy;
    for(const e of enemies){if(e.hp>0&&Math.abs(b.x-e.x)<e.r&&Math.abs(b.y-e.y)<e.r){const bp=players[b.o|0];e.hp-=(b.dmg||1)*dmgMul(bp);e.hitT=4;e.lastHit=b.o|0;b.dead=1;
      if(isBoss(e)&&bp&&bp.supT<=0)bp.sp=Math.min(100,bp.sp+.12);
      parts.push({x:b.x,y:b.y,vx:R(-1,1),vy:R(-2,0),life:10,max:10,col:'#fff',sz:2});rec(['k',r1(b.x),r1(b.y)]);break;}}
  }
  updateWaves();
  for(const e of enemies)if(e.hp<=0&&!e.dead){
    e.dead=1;const T=TYPES[e.type],k=players[e.lastHit|0]||players[0],bo=isBoss(e);
    if(k.supT<=0)k.sp=Math.min(100,k.sp+(bo?0:T.sp||0));
    if(k.sp>=100&&!k.spAnn&&k.supT<=0){k.spAnn=1;if(k.id===(mode==='guest'?1:0)||mode==='host')addFloat({x:k.x,y:k.y-50,t:60,s:['g.superReady'],c:PCOL[mode==='solo'?0:k.id]});}
    const pts=(bo?T.pts*e.lvl:T.pts)*k.combo;k.score+=pts;k.kills++;k.combo=Math.min(k.combo+1,8);k.comboT=110;
    addFloat({x:e.x,y:e.y,t:40,s:'+'+pts,c:mode==='solo'?e.col:PCOL[k.id]});
    if(k.combo>=3&&!bo)addFloat({x:e.x,y:e.y-24,t:44,s:'x'+k.combo+'!',c:k.combo>=6?'#ff3cac':'#ffd23f',sz:15+k.combo*3,pop:1});
    if(bo){for(let i=0;i<8;i++)burst(e.x+R(-50,50),e.y+R(-30,30),i%2?'#ffd23f':'#ff5e3a',30,7);burst(e.x,e.y,'#ffffff',40,10);shake=42;flash=16;slowT=70;sfx('big');boss=null;
      for(let i=0;i<2;i++)pickups.push({x:e.x+(i?30:-30),y:e.y,k:i?'S':'P',t:0});
      dropCrystals(e.x,e.y,12,true);levelComplete(e.lvl||level);}
    else{const big=T.big;burst(e.x,e.y,e.col,big?36:18,big?6:4);shake=Math.max(shake,big?14:4);sfx('boom');
      if(rnd()<(big?.7:.1))pickups.push({x:e.x,y:e.y,k:rnd()<.7?'P':'S',t:0});
      const cr=T.cry>=1?T.cry:(rnd()<(T.cry||0)?1:0);if(cr)dropCrystals(e.x,e.y,cr,false);
      if(T.ai==='shard'&&!e.v){for(const sd of [-1,1])spawn(e.type,e.x+sd*12,e.y,{v:2,r:T.r*.6,hp:1,max:1,vy:2.3,phase:sd*2});burst(e.x,e.y,'#ffffff',10,4);}}
  }
  for(const p of players)if(p.comboT>0&&--p.comboT===0)p.combo=1;
  for(const b of eBullets){for(let st=0;st<steps;st++){b.x+=b.vx;b.y+=b.vy;}
    for(const p of players){if(!p.alive||b.dead)continue;
      if(p.supT>0&&SH(p).superKind==='fortress'&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+40){b.dead=1;if(rnd()<.4)burst(b.x,b.y,SH(p).color,4,2);continue;}
      if(Math.hypot(b.x-p.x,b.y-p.y)<p.r-3){if(p.shield>0){b.dead=1;burst(b.x,b.y,SH(p).color,6,2);}else if(p.inv<=0){b.dead=1;hurt(p);if(state!=='play')return;}}}}
  for(const k of pickups){k.t++;
    if(k.k==='C'){if(k.vx!==undefined){k.x+=k.vx;k.y+=k.vy;k.vx*=.93;k.vy*=.93;}k.y+=1.1;
      let t=null,bd=1e9;for(const p of players){if(!p.alive)continue;const d=Math.hypot(p.x-k.x,p.y-k.y);if(d<bd){bd=d;t=p;}}
      if(t&&(bd<150||(!stageActive&&k.t>40))){const sp=Math.min(10,3+900/(bd+60));k.x+=(t.x-k.x)/bd*sp;k.y+=(t.y-k.y)/bd*sp;}}
    else{k.y+=k.k==='H'?1.25:1.4;k.x+=Math.sin(k.t*.08)*.6;}
    for(const p of players){if(!p.alive||k.dead)continue;
      if(Math.hypot(k.x-p.x,k.y-p.y)<26){k.dead=1;collect(p,k);}}}
  bullets=bullets.filter(b=>!b.dead&&b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
  eBullets=eBullets.filter(b=>!b.dead&&b.y<H+20&&b.y>-40&&b.x>-20&&b.x<W+20);
  enemies=enemies.filter(e=>!e.dead);
  pickups=pickups.filter(k=>!k.dead&&k.y<H+20);
  updateFx();
}
function collect(p,k){
  const who=mode==='solo'?'':' J'+(p.id+1);
  if(k.k==='C'){gainCrystals(p,1);sfx('cry');parts.push({x:k.x,y:k.y,vx:0,vy:-1,life:16,max:16,col:'#c9b8ff',sz:3});return;}
  if(k.k==='H'){
    if(p.lives<LIFE_CAP){p.lives++;sfx('heart');addFloat({x:k.x,y:k.y,t:60,s:['g.life',who],c:'#ff4d8d'});burst(k.x,k.y,'#ff4d8d',22,4);}
    else{sfx('ui');addFloat({x:k.x,y:k.y,t:60,s:['g.maxLives'],c:'#ffb3cf'});}
  }else{sfx('pow');
    if(k.k==='P'){p.power=Math.min(p.power+1,4);addFloat({x:k.x,y:k.y,t:50,s:['g.power'],c:'#7cff6b'});}
    else{p.shield=Math.max(p.shield,480*(1+.1*p.up[3]));addFloat({x:k.x,y:k.y,t:50,s:['g.shield'],c:'#7df9ff'});}}
}
function updateFx(){
  if(state==='win'){winT++;if(winT%14===0){const cols=['#ff3cac','#7df9ff','#ffd23f','#7cff6b','#ff8fd0'];const x=60+Math.random()*(W-120),y=60+Math.random()*(H*.5),c=cols[(winT/14|0)%5];
    for(let i=0;i<30;i++){const a=i/30*6.283,s=2+Math.random()*2.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:50,max:50,col:c,sz:2.5});}}}
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vx*=.96;q.vy*=.96;q.life--;}
  for(const g of rings){g.r+=g.v;g.v*=.9;g.life--;}if(rings.length)rings=rings.filter(g=>g.life>0);
  parts=parts.filter(q=>q.life>0);
  for(const f of floaters){f.t--;if(!f.big)f.y-=.7;}floaters=floaters.filter(f=>f.t>0);

function shootAt(e,s){let t=null,bd=1e9;for(const p of players){if(!p.alive)continue;const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<bd){bd=d;t=p;}}if(!t)return;
  const a=Math.atan2(t.y-e.y,t.x-e.x);ebul(e,e.x,e.y,Math.cos(a)*s,Math.sin(a)*s);}
function hurt(p){

    if(mode==='solo'){

// ---------- draw ----------
const EBK=[['#ff3cac','#ffb3e0'],['#7cff00','#e0ff9a'],['#5fe3ff','#e6fcff'],['#ff7a00','#ffe08a'],['#ff5a2a','#ffc4a8'],['#b44dff','#f3d9ff']]; // colores de balas enemigas por tipo
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x+s*1.1,y-s*.35,x+s*.55,y-s*1.05,x,y-s*.45);ctx.bezierCurveTo(x-s*.55,y-s*1.05,x-s*1.1,y-s*.35,x,y+s*.35);ctx.closePath();}
const SHAPES={
  arrow:{hull:[0,-18,14,12,5,7,-5,7,-14,12],flames:[[0,12,5]],core:[0,-2,3.5]},
  dart:{hull:[0,-24,4,-6,13,9,4,5,0,11,-4,5,-13,9,-4,-6],flames:[[0,11,3]],core:[0,-6,2.5]},
  heavy:{hull:[0,-17,9,-11,11,-3,20,1,20,13,10,10,6,14,-6,14,-10,10,-20,13,-20,1,-11,-3,-9,-11],flames:[[-14,13,4],[14,13,4]],core:[0,0,5]},
  fork:{hull:[0,-8,6,-3,10,-21,15,8,5,12,0,7,-5,12,-15,8,-10,-21,-6,-3],flames:[[-6,11,3.5],[6,11,3.5]],core:[0,2,3.5]},
  wing:{hull:[0,-20,5,-9,13,-6,20,-12,18,4,8,8,4,13,-4,13,-8,8,-18,4,-20,-12,-13,-6,-5,-9],flames:[[-3,12,3],[3,12,3]],core:null,heart:[0,1,6]},
};
function drawShip(x,y,tilt,S,sc=1,col){
  const sh=SHAPES[S.shape],c=col||S.color;
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(sc,sc);
  const fl=8+Math.sin(frame*.8)*4;
  glow('#ff9f1c',20);ctx.fillStyle='#ff9f1c';
  for(const [fx,fy,fw] of sh.flames){ctx.beginPath();ctx.moveTo(fx-fw,fy);ctx.lineTo(fx,fy+fl);ctx.lineTo(fx+fw,fy);ctx.fill();}
  glow(c,18);ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.fillStyle='#1a0b2e';
  poly(sh.hull);ctx.fill();ctx.stroke();
  if(S.shape==='heavy'){ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(6,-6);ctx.stroke();}
  if(S.shape==='fork'){ctx.beginPath();ctx.moveTo(-10,-21);ctx.lineTo(-10,-12);ctx.moveTo(10,-21);ctx.lineTo(10,-12);ctx.stroke();}
  ctx.fillStyle=c;
  if(sh.core){ctx.beginPath();ctx.arc(sh.core[0],sh.core[1],sh.core[2],0,7);ctx.fill();}
  if(sh.heart){heartPath(sh.heart[0],sh.heart[1],sh.heart[2]);ctx.fill();}
  ctx.restore();
}

function drawPlayerShip(p,PS,K){

    drawShip(p.x,p.y,p.tilt,PS,1.35);return;}

  if(K==='pulse'||K==='rain'){const c=K==='pulse'?PS.color:'#ff9f1c',rr=26+Math.sin(frame*.25)*5;ctx.save();glow(c,24);ctx.strokeStyle=c+'aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,7);ctx.stroke();ctx.restore();}
