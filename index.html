<script>
// =====================================================================
//  ✏️  NAVES DEL HANGAR
//  Para cambiar el nombre de una nave, edita solo el campo "name".
//  (El resto de campos controla su aspecto y su forma de jugar.)
// =====================================================================
const SHIPS = [

    superKind: 'pulse', superName: 'ONDA NEÓN', superDesc: 'Pulsos de energía que barren la pantalla y borran las balas enemigas.',
    stats: { VELOCIDAD: 3, CADENCIA: 3, 'DAÑO': 3, BLINDAJE: 3 } },
  { name: 'VID.02',
    desc: 'Interceptor: muy veloz, ráfaga rapidísima y blanco pequeño. Solo 2 vidas.',
    color: '#b77dff', shot: '#e4ccff', shape: 'dart',
    accel: 1.55, lives: 2, radius: 9, fire: 'rapid', cooldown: 4, special: null,
    superKind: 'storm', superName: 'HIPERVELOCIDAD', superDesc: 'El tiempo se ralentiza y desatas una tormenta de balas.',
    stats: { VELOCIDAD: 5, CADENCIA: 5, 'DAÑO': 2, BLINDAJE: 1 } },
  { name: 'CZ.03',
    desc: 'Acorazado: lento, abanico ancho, 4 vidas y escudo al empezar cada oleada.',
    color: '#4dffb0', shot: '#c6ffe7', shape: 'heavy',
    accel: 0.8, lives: 4, radius: 16, fire: 'fan', cooldown: 11, special: 'waveShield',
    superKind: 'fortress', superName: 'FORTALEZA', superDesc: 'Invulnerable con un escudo gigante y un cañón enorme.',
    stats: { VELOCIDAD: 2, CADENCIA: 2, 'DAÑO': 4, BLINDAJE: 5 } },
  { name: 'DA.0V4',
    desc: 'Cazamisiles: misiles teledirigidos de doble daño que persiguen al enemigo.',
    color: '#ffa53d', shot: '#ffe0b3', shape: 'fork',
    accel: 1.0, lives: 3, radius: 13, fire: 'homing', cooldown: 26, special: 'homing',
    superKind: 'rain', superName: 'LLUVIA DE MISILES', superDesc: 'Cae del cielo una lluvia de misiles teledirigidos.',
    stats: { VELOCIDAD: 3, CADENCIA: 1, 'DAÑO': 5, BLINDAJE: 3 } },
  { name: 'Elani',
    desc: 'Veloz y nunca sola: D-unior, su nave bebé, vuela a su lado y dispara contigo.',
    color: '#ff8fd0', shot: '#ffd6ee', shape: 'wing',
    accel: 1.45, lives: 3, radius: 11, fire: 'twin', cooldown: 8, special: 'companion',
    superKind: 'fusion', superName: 'FUSIÓN', superDesc: 'Elani y D-unior se unen en una nave gigante con un rayo imparable.',
    companion: { name: 'D-unior', color: '#ffc4ea', cooldown: 15 },
    stats: { VELOCIDAD: 5, CADENCIA: 3, 'DAÑO': 3, BLINDAJE: 2 } },
];

// =====================================================================
//  🌌  NIVELES / GALAXIAS (6 niveles: 2 oleadas + 1 jefe cada uno)
// =====================================================================
const LEVELS = [
  { name: 'Nebulosa Violeta',  sky: ['#0a0322', '#1a0538'], neb: ['#7b2cff', '#ff3cac', '#3a0ca3'], star: '205,215,255', grid: '#ff3cac',
    planets: [ { r: 48, c1: '#c39bff', c2: '#2e0f63', ring: '#e7d6ff', x: .16, speed: .22, phase: 250, bands: '#ffffff' } ] },
  { name: 'Galaxia Esmeralda', sky: ['#01140f', '#042b1d'], neb: ['#00ffa3', '#00b3ff', '#0b7a55'], star: '200,255,230', grid: '#3cffb4',
    planets: [ { r: 40, c1: '#7dffc8', c2: '#0a4a37', moons: 1, x: .82, speed: .26, phase: 260, bands: '#003322' },
               { r: 14, c1: '#ffe9a8', c2: '#7a5a12', x: .3, speed: .4, phase: 120 } ] },
  { name: 'Nebulosa Carmesí',  sky: ['#170105', '#36040f'], neb: ['#ff2a4d', '#ff7a3d', '#7a0420'], star: '255,214,214', grid: '#ff4d6d',
    planets: [ { r: 36, c1: '#ff8a6a', c2: '#4a0808', moons: 2, craters: 1, x: .2, speed: .3, phase: 210 } ] },
  { name: 'Cúmulo Zafiro',     sky: ['#010720', '#031a48'], neb: ['#2a6bff', '#7df9ff', '#1b2a8a'], star: '215,235,255', grid: '#5aa9ff', dense: 1,
    planets: [ { r: 44, c1: '#d6f3ff', c2: '#1d4f8f', ring: '#bfe6ff', x: .78, speed: .2, phase: 240, bands: '#7fb6ff' },
               { r: 11, c1: '#9fb4ff', c2: '#20306e', x: .12, speed: .45, phase: 420 } ] },
  { name: 'Nebulosa Ámbar',    sky: ['#170a00', '#382003'], neb: ['#ffb020', '#ff6a00', '#7a3a00'], star: '255,236,205', grid: '#ffb020',
    planets: [ { r: 74, c1: '#ffd9a0', c2: '#7a3c0a', moons: 1, x: .84, speed: .16, phase: 330, bands: '#a85a1a' } ] },
  { name: 'Corona del Sol',    sky: ['#180400', '#3a0c00'], neb: ['#ff8a00', '#ffcf3d', '#ff3d00'], star: '255,240,210', grid: '#ffcf3d', sun: 1,
    planets: [ { r: 13, c1: '#7cc4ff', c2: '#123a7a', x: .14, speed: .35, phase: 380, bands: '#3fbf6f' } ] },
];

// =====================================================================
//  💎  MEJORAS PERMANENTES (se compran con CRISTALES en el Hangar)
// =====================================================================
const UPGRADES = [
  { name: 'VELOCIDAD',    base: 'VELOCIDAD', per: 0.08, fx: l => '+' + Math.round(l * 8) + '% velocidad' },
  { name: 'DAÑO',         base: 'DAÑO',      per: 0.15, fx: l => '+' + Math.round(l * 15) + '% daño' },
  { name: 'CADENCIA',     base: 'CADENCIA',  per: 0.07, fx: l => '+' + Math.round(l * 7) + '% disparo' },
  { name: 'ESCUDO EXTRA', base: 'BLINDAJE',  per: 1,    fx: l => '+' + l + ' s escudo/oleada' },
];
const UPGRADE_COSTS = [20, 45, 80, 130, 200];   // precio de los niveles 1..5

(()=>{
'use strict';
const W=720,H=540,LIFE_CAP=4,STAGES=3; // STAGES: 2 oleadas + jefe
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const params=new URLSearchParams(location.search);
const CAPTURE=params.has('capture');       // frame-stepped mode used to record the preview
const DEMO_FORCED=params.has('demo');       // AI plays automatically
const DEBUG=params.has('debug');            // exposes test hooks (used by automated tests)

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();

// ---------- storage ----------
function load(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(_){return d;}}
function save(k,v){try{localStorage.setItem(k,v);}catch(_){}}
let shipIdx=+load('neonDriftShip',0);if(!(shipIdx>=0&&shipIdx<SHIPS.length))shipIdx=0;
if(params.has('ship'))shipIdx=Math.max(0,Math.min(SHIPS.length-1,+params.get('ship')||0));
let hangarSel=shipIdx,hangarCtx='solo';
const ship=()=>SHIPS[shipIdx];
const SH=p=>SHIPS[p.ship];
const startLives=S=>Math.min(S.lives,LIFE_CAP);
const jget=(k,d)=>{try{const v=JSON.parse(load(k,'null'));return v&&typeof v==='object'?v:d;}catch(_){return d;}};
let crystals=Math.max(0,+load('neonDriftCrystals',0)||0);
const upg=jget('neonDriftUpg',{});
const cleanUp=a=>[0,1,2,3].map(i=>Math.max(0,Math.min(5,(Array.isArray(a)?a[i]:0)|0)));
const getUpg=si=>cleanUp(upg[si]);
function addCrystals(n){crystals+=n;save('neonDriftCrystals',crystals);}
let hangarMsg=null,upSel=0;
function buyUpgrade(k){
  const a=getUpg(hangarSel),lv=a[k];
  if(lv>=5){hangarMsg={s:UPGRADES[k].name+' ya está al máximo',c:'#ffffffcc',t:100};sfx('ui');return;}
  const c=UPGRADE_COSTS[lv];
  if(crystals<c){hangarMsg={s:'Te faltan ◆ '+(c-crystals)+' cristales. ¡Destruye enemigos para conseguirlos!',c:'#ff5e7a',t:140};sfx('hit');return;}
  crystals-=c;save('neonDriftCrystals',crystals);a[k]++;upg[hangarSel]=a;save('neonDriftUpg',JSON.stringify(upg));
  hangarMsg={s:'¡'+UPGRADES[k].name+' nivel '+a[k]+'!  ('+UPGRADES[k].fx(a[k])+')',c:'#7cff6b',t:120};sfx('pow');
}
// mapa galáctico: u = galaxias desbloqueadas, done/stars/best por galaxia
const mapP=Object.assign({u:1,done:[],stars:[],best:[]},jget('neonDriftMap',{}));
mapP.u=Math.max(1,Math.min(LEVELS.length,mapP.u|0));
for(const k of ['done','stars','best'])if(!Array.isArray(mapP[k]))mapP[k]=[];
const saveMap=()=>save('neonDriftMap',JSON.stringify(mapP));
let mapSel=mapP.u-1,playLv=1,mapMsg=null;
function markLevel(L,pts,hits){
  const i=L-1,isNew=L<LEVELS.length&&mapP.u<L+1;
  mapP.done[i]=1;mapP.stars[i]=Math.max(mapP.stars[i]|0,hits<=0?3:hits===1?2:1);mapP.best[i]=Math.max(mapP.best[i]|0,pts|0);
  mapP.u=Math.max(mapP.u,Math.min(LEVELS.length,L+1));saveMap();
  if(isNew)floaters.push({x:W/2,y:H/2+40,t:150,s:'¡'+LEVELS[L].name.toUpperCase()+' DESBLOQUEADA!',c:LEVELS[L].grid,big:20});
}
// efectos de las mejoras
const accelOf=p=>SH(p).accel*(1+UPGRADES[0].per*p.up[0])*(p.supT>0&&SH(p).superKind==='storm'?1.3:1);
const dmgMul=p=>p?1+UPGRADES[1].per*p.up[1]:1;
const cdMul=p=>1-UPGRADES[2].per*p.up[2];

// ---------- seeded RNG (deterministic preview) ----------
let seed=params.has('seed')?+params.get('seed'):(CAPTURE?1337:(Date.now()&0xffffffff));
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const R=(a,b)=>a+rnd()*(b-a);
function mkRand(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- mode: 'solo' | 'host' (J1, runs the simulation) | 'guest' (J2, renders host snapshots) ----------
let mode='solo';
const PCOL=['#ffd23f','#7cff6b'];          // label colours J1 / J2
let netEv=[];                               // host -> guest visual/sound events
const rec=e=>{if(mode==='host')netEv.push(e);};

// ---------- audio (tiny synth, starts after first input) ----------
let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}}}
function sfx(type){
  if(type!=='shoot'&&type!=='missile'&&type!=='ui'&&type!=='cry')rec(['s',type]);
  if(!AC||muted||CAPTURE)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const P={shoot:['square',880,440,.04,.06],missile:['triangle',520,260,.05,.09],boom:['sawtooth',160,40,.12,.35],hit:['triangle',300,90,.15,.25],pow:['sine',500,1400,.12,.25],big:['sawtooth',110,30,.2,.7],ui:['sine',660,990,.08,.08],heart:['sine',700,1600,.14,.3],win:['triangle',400,1600,.15,.9],super:['sawtooth',90,1800,.16,.8],cry:['sine',1300,2400,.05,.07]}[type];
  o.type=P[0];o.frequency.setValueAtTime(P[1],t);o.frequency.exponentialRampToValueAtTime(P[2],t+P[4]);
  g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[4]);o.start(t);o.stop(t+P[4]);
}

// ---------- galaxy backgrounds (pre-rendered offscreen) ----------
const bgCache={},bgStart={};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function planetSprite(P,rr){
  const r=P.r,ext=P.ring?r*1.9:r*1.25,S=Math.ceil(ext*2+8),c=mkCanvas(S,S),g=c.getContext('2d'),cx=S/2,cy=S/2;
  const ring=(a0,a1)=>{g.save();g.translate(cx,cy);g.rotate(-.38);g.scale(1,.3);g.strokeStyle=P.ring;g.globalAlpha=.75;g.lineWidth=r*.22;g.beginPath();g.arc(0,0,r*1.62,a0,a1);g.stroke();
    g.globalAlpha=.4;g.lineWidth=r*.08;g.beginPath();g.arc(0,0,r*1.88,a0,a1);g.stroke();g.restore();};
  if(P.ring)ring(Math.PI,2*Math.PI);
  // atmosphere glow
  const ag=g.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.25);ag.addColorStop(0,P.c1+'55');ag.addColorStop(1,P.c1+'00');g.fillStyle=ag;g.beginPath();g.arc(cx,cy,r*1.25,0,7);g.fill();
  const sg=g.createRadialGradient(cx-r*.4,cy-r*.4,r*.1,cx,cy,r);sg.addColorStop(0,P.c1);sg.addColorStop(1,P.c2);
  g.fillStyle=sg;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();
  if(P.bands){g.globalAlpha=.22;g.fillStyle=P.bands;for(let i=0;i<7;i++){const y=cy-r+(i+.5)*(2*r/7)+rr()*4;g.fillRect(cx-r,y,2*r,r*(.06+rr()*.12));}g.globalAlpha=1;}
  if(P.craters){g.fillStyle='#00000040';for(let i=0;i<9;i++){g.beginPath();g.arc(cx+(rr()-.5)*r*1.5,cy+(rr()-.5)*r*1.5,r*(.06+rr()*.14),0,7);g.fill();}}
  // night side shadow
  const ns=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);ns.addColorStop(0,'#00000000');ns.addColorStop(.55,'#00000010');ns.addColorStop(1,'#000000a0');g.fillStyle=ns;g.fillRect(cx-r,cy-r,2*r,2*r);
  g.restore();
  if(P.ring)ring(0,Math.PI);
  return c;
}
function sunSprite(rr){
  const r=150,S=r*4,c=mkCanvas(S,S),g=c.getContext('2d'),cx=S/2,cy=S/2;
  const co=g.createRadialGradient(cx,cy,r*.9,cx,cy,r*2);co.addColorStop(0,'#ffd23fcc');co.addColorStop(.35,'#ff8a0055');co.addColorStop(1,'#ff3d0000');
  g.fillStyle=co;g.beginPath();g.arc(cx,cy,r*2,0,7);g.fill();
  // prominences
  g.strokeStyle='#ffb02088';g.lineWidth=5;for(let i=0;i<9;i++){const a=rr()*6.283,s=r*(1.02+rr()*.08);g.beginPath();g.arc(cx+Math.cos(a)*s,cy+Math.sin(a)*s,r*(.08+rr()*.12),a+Math.PI*.9,a+Math.PI*2.1);g.stroke();}
  const b=g.createRadialGradient(cx-r*.2,cy-r*.2,r*.05,cx,cy,r);b.addColorStop(0,'#fffbe0');b.addColorStop(.45,'#ffe066');b.addColorStop(.85,'#ffa21f');b.addColorStop(1,'#ff6a00');
  g.fillStyle=b;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,r,0,7);g.clip();
  for(let i=0;i<420;i++){const a=rr()*6.283,d=Math.sqrt(rr())*r;g.fillStyle=rr()<.5?'#fff6c055':'#ff7a0040';g.beginPath();g.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,1.5+rr()*4,0,7);g.fill();}
  for(let i=0;i<3;i++){g.fillStyle='#b8400060';g.beginPath();g.arc(cx+(rr()-.5)*r,cy+(rr()-.5)*r,4+rr()*6,0,7);g.fill();} // sunspots
  g.restore();
  return c;
}
function getBg(li){
  if(bgCache[li])return bgCache[li];
  const L=LEVELS[li],rr=mkRand(1000+li*7919),neb=mkCanvas(W,H),g=neb.getContext('2d');
  g.globalCompositeOperation='lighter'; // nebula layer is transparent so it tiles seamlessly while scrolling
  for(let i=0;i<16;i++){const x=rr()*W,y=rr()*H,rad=70+rr()*190,col=L.neb[i%3],a=Math.round((L.sun?.07:.09+rr()*.1)*255).toString(16).padStart(2,'0');
    for(const yy of [y-H,y,y+H]){const ng=g.createRadialGradient(x,yy,0,x,yy,rad);ng.addColorStop(0,col+a);ng.addColorStop(1,col+'00');g.fillStyle=ng;g.fillRect(x-rad,yy-rad,rad*2,rad*2);}}
  g.globalCompositeOperation='source-over';
  const dust=L.dense?700:320;for(let i=0;i<dust;i++){g.fillStyle=`rgba(${L.star},${(.15+rr()*.5).toFixed(2)})`;const s=rr()<.92?1:2;g.fillRect(rr()*W,rr()*H,s,s);}
  const planets=L.planets.map(P=>({P,img:planetSprite(P,rr)}));
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,L.sky[0]);sky.addColorStop(1,L.sky[1]);
  return bgCache[li]={neb,sky,planets,sun:L.sun?sunSprite(rr):null};
}
function drawBg(li,alpha){
  const B=getBg(li),L=LEVELS[li];
  ctx.globalAlpha=alpha;
  ctx.fillStyle=B.sky;ctx.fillRect(0,0,W,H);
  const off=(frame*.35)%H;ctx.globalCompositeOperation='lighter';ctx.drawImage(B.neb,0,off-H);ctx.drawImage(B.neb,0,off);ctx.globalCompositeOperation='source-over';
  if(B.sun){const s=1+Math.sin(frame*.03)*.02,sz=B.sun.width*s;ctx.drawImage(B.sun,W*.7-sz/2,96-sz/2,sz,sz);}
  for(const {P,img} of B.planets){
    const span=H+img.height*1.5,y=(((frame-(bgStart[li]||0))*P.speed+P.phase)%span)-img.height*.75,x=P.x*W;
    ctx.globalAlpha=alpha*.9;ctx.drawImage(img,x-img.width/2,y-img.height/2);
    for(let m=0;m<(P.moons||0);m++){const a=frame*.012*(m?1.6:1)+m*2.4,mx=x+Math.cos(a)*P.r*(1.7+m*.5),my=y+Math.sin(a)*P.r*.55;
      ctx.fillStyle=m?'#d8d0c8':'#bfb7ae';ctx.globalAlpha=alpha*(Math.sin(a)<0?.55:.95);ctx.beginPath();ctx.arc(mx,my,Math.max(3,P.r*.13),0,7);ctx.fill();}
  }
  ctx.globalAlpha=1;
}

// ---------- world ----------
let state='title',demo=true,frame=0,shake=0,flash=0,menuFocus=0;
let players=[],player,bullets,eBullets,enemies,parts,pickups,floaters,wave,level,stage,stageActive,waveTimer,boss,nid=0;
let waves=[],slowAcc=0;
const SUP_T=330; // duración del súper (~5,5 s)
let bgLevel=0,bgPrev=0,bgFade=1,winT=0;
let hi=+load('neonDriftHi',0);
const stars=[];for(let i=0;i<140;i++)stars.push({x:R(0,W),y:R(0,H),z:R(.2,1)});

function makePlayer(id,si,x,up){
  const S=SHIPS[si];
  return{id,ship:si,x,y:H-70,vx:0,vy:0,r:S.radius,cd:0,inv:90,power:1,shield:0,tilt:0,alt:false,
    lives:startLives(S),score:0,kills:0,combo:1,comboT:0,alive:true,up:cleanUp(up),sp:0,supT:0,cry:0,ls:0,lh:0,
    buddy:S.companion?{x:x-36,y:H-56,cd:20,side:-1}:null};
}
function reset(ships,ups,lv){
  lv=Math.max(1,Math.min(LEVELS.length,lv|0||1));ups=ups||[];
  players=mode==='solo'?[makePlayer(0,shipIdx,W/2,getUpg(shipIdx))]:[makePlayer(0,ships[0],W/2-90,ups[0]),makePlayer(1,ships[1],W/2+90,ups[1])];
  player=players[0];
  for(const p of players)p.power=1+Math.min(2,(lv-1)>>1); // empezar en galaxias avanzadas da algo más de potencia
  bullets=[];eBullets=[];enemies=[];parts=[];pickups=[];floaters=[];netEv=[];waves=[];slowAcc=0;
  wave=(lv-1)*STAGES;level=lv;stage=0;stageActive=false;waveTimer=60;boss=null;
  setBg(lv-1,true);
}
function setBg(li,instant){bgStart[li]=frame;if(li===bgLevel&&bgFade>=1)return;bgPrev=instant?li:bgLevel;bgLevel=li;bgFade=instant?1:0;getBg(li);}
function startGame(isDemo,lv){mode='solo';demo=isDemo;if(!isDemo)playLv=lv||playLv||1;reset(null,null,isDemo?1:playLv);state='play';}

// =====================================================================
//  ONLINE (PeerJS / WebRTC). La librería solo se carga al entrar en
//  "EN LÍNEA", así que el juego de 1 jugador funciona sin internet.
// =====================================================================
const NAT_MSG='Se encontró la sala, pero la red no deja conectar los dos dispositivos. Prueben con otra red (por ejemplo, datos móviles).';
const NET_V=2,PREFIX='neondrift-v1-',CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ';
const PEER_URLS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const net={role:null,phase:'menu',peer:null,conn:null,code:'',typed:'',status:'',error:'',connected:false,
  myReady:false,peerReady:false,peerShip:0,peerUp:[0,0,0,0],ups:null,startLv:1,lastRecv:0,snaps:[],renderF:0,remote:null,joinTimer:null,leaving:false};
function setPhase(p){net.phase=p;menuFocus=0;}
function send(m){try{if(net.conn&&net.conn.open)net.conn.send(m);}catch(_){}}
function loadPeer(cb){
  if(window.Peer)return cb(true);
  let i=0,done=false;
  const next=()=>{if(i>=PEER_URLS.length){done=true;return cb(false);}
    const s=document.createElement('script');s.src=PEER_URLS[i++];s.async=true;
    const to=setTimeout(()=>{s.onload=s.onerror=null;s.remove();next();},9000);
    s.onload=()=>{clearTimeout(to);if(window.Peer){done=true;cb(true);}else next();};
    s.onerror=()=>{clearTimeout(to);s.remove();next();};
    document.head.appendChild(s);};
  next();
}
function errMsg(err){
  const t=err&&err.type;
  if(t==='peer-unavailable')return'Sala no encontrada. Revisa el código e inténtalo de nuevo.';
  if(t==='unavailable-id')return'Ese código de sala ya está en uso. Crea otra sala.';
  if(t==='browser-incompatible')return'Tu navegador no permite el modo en línea.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'No se pudo conectar con el servidor en línea. Revisa tu internet e inténtalo de nuevo.';
  if(t==='webrtc'||t==='negotiation-failed')return'No se pudo establecer la conexión directa con tu amigo (red bloqueada).';
  return'Error de conexión'+(t?' ('+t+')':'')+'. Inténtalo de nuevo.';
}
function netCleanup(){
  clearTimeout(net.joinTimer);
  const p=net.peer,c=net.conn;net.peer=null;net.conn=null;net.connected=false;
  try{c&&c.close();}catch(_){}
  setTimeout(()=>{try{p&&p.destroy();}catch(_){}},150);
  net.snaps=[];net.remote=null;net.myReady=net.peerReady=false;
}
function netFail(msg){if(net.leaving)return;netCleanup();mode='solo';state='online';net.error=msg;setPhase('error');sfx('hit');}
function openOnline(){state='online';net.error='';setPhase('menu');sfx('ui');}
function netLeave(){net.leaving=true;send({t:'bye'});netCleanup();setTimeout(()=>net.leaving=false,300);mode='solo';net.role=null;openOnline();}
function genCode(){let s='';for(let i=0;i<4;i++)s+=CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)];return s;}
function withPeer(fn){setPhase('loading');net.status='Cargando el modo en línea…';
  loadPeer(ok=>{if(state!=='online'||net.phase!=='loading')return;if(!ok)return netFail('No se pudo cargar el modo en línea. Revisa tu conexión a internet (el modo de 1 jugador sigue funcionando).');fn();});}
function createRoom(tries=0){
  net.role='host';net.leaving=false;
  withPeer(()=>{
    net.code=genCode();setPhase('host-wait');net.status='Conectando al servidor…';
    let peer;try{peer=new Peer(PREFIX+net.code,{debug:0});}catch(e){return netFail(errMsg({type:'browser-incompatible'}));}
    net.peer=peer;
    peer.on('open',()=>{if(net.peer===peer)net.status='Esperando a tu amigo…';});
    peer.on('connection',c=>{
      if(net.conn&&net.conn.open){c.on('open',()=>{try{c.send({t:'full'});}catch(_){}setTimeout(()=>c.close(),400);});return;}
      setupConn(c);});
    peer.on('error',err=>{if(net.peer!==peer)return;
      if(err.type==='unavailable-id'&&tries<4){net.peer=null;try{peer.destroy();}catch(_){}createRoom(tries+1);return;}
      if(err.type==='peer-unavailable')return; // a guest vanished before connecting: ignore
      if(net.connected&&(err.type==='network'||err.type==='server-error'||err.type==='socket-error'||err.type==='socket-closed'))return; // broker lost but P2P link still up
      netFail(errMsg(err));});
    peer.on('disconnected',()=>{if(net.peer===peer&&!net.connected){try{peer.reconnect();}catch(_){}}});
  });
}
function joinRoom(code){
  net.role='guest';net.leaving=false;net.code=code;
  withPeer(()=>{
    setPhase('connecting');net.status='Conectando al servidor…';
    let peer;try{peer=new Peer({debug:0});}catch(e){return netFail(errMsg({type:'browser-incompatible'}));}
    net.peer=peer;
    peer.on('open',()=>{if(net.peer!==peer)return;net.status='Buscando la sala '+code+'…';
      const c=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});setupConn(c);
      try{const pc=c.peerConnection;pc&&pc.addEventListener('iceconnectionstatechange',()=>{if(pc.iceConnectionState==='failed'&&net.conn===c&&!net.connected)netFail(NAT_MSG);});}catch(_){}});
    peer.on('error',err=>{if(net.peer!==peer)return;if(net.connected&&err.type!=='peer-unavailable')return;netFail(errMsg(err));});
    clearTimeout(net.joinTimer);
    // si en 15 s no llegó "sala no encontrada", la sala existe pero la red bloquea la conexión directa
    net.joinTimer=setTimeout(()=>{if(net.peer===peer&&!net.connected)netFail(NAT_MSG);},15000);
  });
}
function setupConn(c){
  net.conn=c;
  c.on('open',()=>{if(net.conn!==c)return;net.connected=true;net.lastRecv=performance.now();clearTimeout(net.joinTimer);
    net.myReady=net.peerReady=false;send({t:'hello',v:NET_V,ship:shipIdx,up:getUpg(shipIdx)});if(net.role==='host')send({t:'gal',l:net.startLv});setPhase('lobby');state='online';sfx('pow');});
  c.on('data',d=>{if(net.conn===c)onData(d);});
  c.on('close',()=>{if(net.conn===c)netFail('Conexión perdida con tu amigo.');});
  c.on('error',()=>{if(net.conn===c)netFail('Conexión perdida con tu amigo.');});
}
function onData(d){
  net.lastRecv=performance.now();
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case'hello':if(d.v!==NET_V)return netFail('Tienen versiones distintas del juego. Recarguen la página los dos.');net.peerShip=d.ship|0;net.peerUp=cleanUp(d.up);break;
    case'ship':net.peerShip=d.ship|0;net.peerUp=cleanUp(d.up);break;
    case'gal':if(net.role==='guest')net.startLv=Math.max(1,Math.min(LEVELS.length,d.l|0));break;
    case'sup':if(mode==='host')activateSuper(players[1]);break;
    case'ready':net.peerReady=!!d.r;maybeStart();break;
    case'full':netFail('Esa sala ya está llena (solo caben 2 jugadores).');break;
    case'bye':netFail('Tu amigo salió de la sala.');break;
    case'start':if(net.role==='guest'){mode='guest';demo=false;net.ups=d.ups||[];reset(d.ships,d.ups,d.lv);state='play';net.snaps=[];net.renderF=0;}break;
    case'lobby':if(net.role==='guest'){mode='solo';state='online';net.myReady=net.peerReady=false;setPhase('lobby');}break;
    case's':if(mode==='guest'){net.snaps.push(d);if(net.snaps.length>30)net.snaps.splice(0,net.snaps.length-30);for(const e of d.ev||[])playEv(e);}break;
    case'i':if(mode==='host')net.remote=d;break;
  }
}
function toggleReady(){net.myReady=!net.myReady;send({t:'ready',r:net.myReady});sfx('ui');maybeStart();}
function maybeStart(){
  if(net.role!=='host'||!net.myReady||!net.peerReady||state!=='online')return;
  mode='host';demo=false;const ships=[shipIdx,net.peerShip],ups=[getUpg(shipIdx),net.peerUp];reset(ships,ups,net.startLv);state='play';net.remote=null;
  send({t:'start',ships,ups,lv:net.startLv});
}
function hostGal(d){if(net.role!=='host')return;const u=mapP.u;net.startLv=((net.startLv-1+d+u)%u)+1;send({t:'gal',l:net.startLv});sfx('ui');}
function rematch(){if(net.role!=='host')return;send({t:'lobby'});mode='solo';state='online';net.myReady=net.peerReady=false;setPhase('lobby');}
setInterval(()=>{ // heartbeat + timeout
  if(!net.connected)return;
  send({t:'p'});
  if(performance.now()-net.lastRecv>8000)netFail('Conexión perdida con tu amigo (sin respuesta).');
},1000);
addEventListener('beforeunload',()=>{if(net.connected)send({t:'bye'});});

// ---- host: snapshot of the whole match (~30 por segundo) ----
const TCODE={drone:0,zig:1,tank:2,boss:3},TNAME=['drone','zig','tank','boss'];
const r1=v=>Math.round(v*10)/10;
const idOf=o=>o.id||(o.id=++nid);
function sendSnapshot(){
  const kind=b=>b.homing?3:b.buddy?4:b.fat?2:b.thin?1:0;
  send({t:'s',f:frame,st:state,lv:level,sg:stage,bg:bgLevel,sh:r1(shake),fl:flash,
    P:players.map(p=>[r1(p.x),r1(p.y),r1(p.tilt),p.lives,p.score,p.kills,p.power,p.shield,p.inv,p.alive?1:0,p.ship,p.combo,p.buddy?r1(p.buddy.x):0,p.buddy?r1(p.buddy.y):0,Math.floor(p.sp),p.supT,p.cry]),
    W:waves.map(w=>[r1(w.x),r1(w.y),r1(w.r),w.o]),
    E:enemies.map(e=>[idOf(e),TCODE[e.type],r1(e.x),r1(e.y),e.hp,e.max,e.hitT,e.t,e.lvl||0]),
    B:bullets.map(b=>[idOf(b),r1(b.x),r1(b.y),kind(b),b.o|0,r1(b.vx),r1(b.vy)]),
    Q:eBullets.map(b=>[idOf(b),r1(b.x),r1(b.y)]),
    K:pickups.map(k=>[idOf(k),r1(k.x),r1(k.y),k.k,k.t]),
    ev:netEv});
  netEv=[];
}
// ---- guest: replay host events + interpolate between snapshots ----
function playEv(e){
  if(e[0]==='b')burst(e[1],e[2],e[3],e[4],e[5]);
  else if(e[0]==='f')floaters.push({x:e[1],y:e[2],t:e[3],s:e[4],c:e[5],big:e[6]||0});
  else if(e[0]==='s')sfx(e[1]);
  else if(e[0]==='c'){if(e[1]===1)addCrystals(e[2]);}
  else if(e[0]==='L'){const q=(e[2]||[])[1];if(q)markLevel(e[1],q[0],q[1]);}
  else if(e[0]==='k')parts.push({x:e[1],y:e[2],vx:Math.random()*2-1,vy:-Math.random()*2,life:10,max:10,col:'#fff',sz:2});
}
function guestTick(){
  const me=players[1];
  if(state==='play'&&me&&me.alive){
    const S=SH(me),inp=localInput(me);
    const ac=accelOf(me);me.vx+=inp.x*ac;me.vy+=inp.y*ac;me.vx*=.82;me.vy*=.82;me.x+=me.vx;me.y+=me.vy;
    me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(40,Math.min(H-24,me.y));me.tilt+=(me.vx*.06-me.tilt)*.3;
    if(me.buddy){const b=me.buddy;if(me.supT>0){b.x+=(me.x-b.x)*.25;b.y+=(me.y-b.y)*.25;}else{if(me.x<70)b.side=1;else if(me.x>W-70)b.side=-1;b.x+=(me.x+b.side*36-b.x)*.14;b.y+=(me.y+14+Math.sin(frame*.09)*4-b.y)*.14;}}
    if(frame%2===0)send({t:'i',x:r1(me.x),y:r1(me.y),tl:r1(me.tilt)});
  }
  const sn=net.snaps;
  if(sn.length){
    const last=sn[sn.length-1],tgt=last.f-5;
    if(!net.renderF||Math.abs(net.renderF-tgt)>45)net.renderF=tgt;else net.renderF+=1+(tgt-net.renderF)*.06;
    let i=sn.length-1;while(i>0&&sn[i-1].f>net.renderF)i--;
    const s1=sn[i],s0=i>0?sn[i-1]:s1,a=s1.f>s0.f?Math.max(0,Math.min(1,(net.renderF-s0.f)/(s1.f-s0.f))):1;
    if(i>2)sn.splice(0,i-2);
    const L=(v0,v1)=>v0+(v1-v0)*a;
    const lerpList=(l1,l0,mk)=>{const m=new Map();for(const o of l0)m.set(o[0],o);return l1.map(o=>{const p=m.get(o[0])||o;return mk(o,L(p[1],o[1]),L(p[2],o[2]));});};
    enemies=lerpList(s1.E.map(e=>[e[0],e[2],e[3],e]),s0.E.map(e=>[e[0],e[2],e[3]]),(o,x,y)=>{const e=o[3],tn=TNAME[e[1]];return{id:e[0],type:tn,x,y,r:TYPES[tn].r,col:TYPES[tn].col,hp:e[4],max:e[5],hitT:e[6],t:e[7],lvl:e[8]};});
    bullets=lerpList(s1.B,s0.B,(o,x,y)=>({x,y,homing:o[3]===3,buddy:o[3]===4,fat:o[3]===2,thin:o[3]===1,o:o[4],vx:o[5],vy:o[6]}));
    eBullets=lerpList(s1.Q,s0.Q,(o,x,y)=>({x,y}));
    pickups=lerpList(s1.K,s0.K,(o,x,y)=>({x,y,k:o[3],t:o[4]}));
    s1.P.forEach((q,j)=>{
      let p=players[j];if(!p||p.ship!==q[10]){p=players[j]=makePlayer(j,q[10],q[0],(net.ups||[])[j]);}
      const q0=s0.P[j]||q;
      if(j!==1||!p.alive||q[9]===0){p.x=L(q0[0],q[0]);p.y=L(q0[1],q[1]);p.tilt=q[2];if(p.buddy){p.buddy.x=L(q0[12],q[12]);p.buddy.y=L(q0[13],q[13]);}}
      p.lives=q[3];p.score=q[4];p.kills=q[5];p.power=q[6];p.shield=q[7];p.inv=q[8];p.alive=!!q[9];p.combo=q[11];p.sp=q[14]||0;p.supT=q[15]||0;p.cry=q[16]||0;
    });
    player=players[0];
    // latest global state (not interpolated)
    waves=(last.W||[]).map(w=>({x:w[0],y:w[1],r:w[2],o:w[3]}));
    level=last.lv;stage=last.sg;if(last.bg!==bgLevel)setBg(last.bg,false);
    if(last.sh>shake)shake=last.sh;if(last.fl>flash)flash=last.fl;
    if(last.st!==state&&(last.st==='over'||last.st==='win')){menuFocus=0;if(last.st==='win'){winT=0;}}
    state=last.st;
  }
  updateFx();
}

function tryJoin(){if(net.typed.length<4){net.error='El código tiene 4 letras.';return;}joinRoom(net.typed);}
const CARD={w:132,h:186,gap:8,y:52},UPROW={y:306,h:36};
const MAPN=LEVELS.map((L,i)=>({x:90+i*108,y:i%2?172:262}));
function cardRect(i){const n=SHIPS.length,x0=(W-(CARD.w*n+CARD.gap*(n-1)))/2;return{x:x0+i*(CARD.w+CARD.gap),y:CARD.y,w:CARD.w,h:CARD.h};}

// ---------- input ----------
const keys={};
addEventListener('keydown',e=>{
  initAudio();
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace'].includes(e.code))e.preventDefault();
  if(e.repeat&&state!=='play')return;
  if(e.code==='KeyM'){muted=!muted;return;}
  const left=e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowUp',right=e.code==='ArrowRight'||e.code==='KeyD'||e.code==='ArrowDown',ok=e.code==='Enter'||e.code==='Space',esc=e.code==='Escape';
  if(state==='play'||state==='pause'){
    if(state==='play'&&['Space','ShiftLeft','ShiftRight','KeyE'].includes(e.code)){if(!e.repeat)trySuper();return;}
    if(mode==='solo'&&(e.code==='KeyP'||esc))state=state==='play'?'pause':'play';
    return;
  }
  if(state==='map'){
    if(left)mapPick(mapSel-1);else if(right)mapPick(mapSel+1);

  if(state==='hangar'){
    if(e.code==='ArrowLeft'||e.code==='KeyA')pickShip(hangarSel-1);
    else if(e.code==='ArrowRight'||e.code==='KeyD')pickShip(hangarSel+1);

    else if(e.code==='KeyU')buyUpgrade(upSel);
    else if(ok)launch();
    else if(esc||e.code==='Backspace')hangarBack();
    return;
  }
  if(state==='online'&&net.phase==='join-input'){
    if(/^Key[A-Z]$/.test(e.code))typeCode(e.code.slice(3));
    else if(e.code==='Backspace')typeCode('⌫');
    else if(e.code==='Enter')tryJoin();
    else if(esc)openOnline();
    return;
  }
  const bs=menuButtons();if(!bs.length)return;
  if(left||right){menuFocus=(menuFocus+(right?1:-1)+bs.length)%bs.length;sfx('ui');return;}
  if(state==='title'&&e.code==='KeyH')return openHangar('solo');
  if(state==='title'&&e.code==='KeyL')return openOnline();
  if((state==='title'||((state==='over'||state==='win')&&mode==='solo'))&&e.code==='KeyG')return openMap();
  if(state==='online'&&net.phase==='lobby'&&e.code==='KeyG')return hostGal(1);
  if((state==='over'||state==='win')&&mode==='solo'&&e.code==='KeyH')return openHangar('solo');
  if(state==='online'&&net.phase==='lobby'&&e.code==='KeyH')return openHangar('mp');
  if(esc){
    if(state==='online'){if(net.phase==='menu'||net.phase==='error')return net.phase==='menu'?toTitle():openOnline();if(net.phase==='lobby')return netLeave();return bs[bs.length-1].act();}
    if((state==='over'||state==='win')&&mode!=='solo')return netLeave();
  }
  if(ok){(bs[menuFocus]||bs[0]).act();}
});

function trySuper(){if(mode==='guest'){const me=players[1];if(me&&me.sp>=100&&me.supT<=0)send({t:'sup'});return;}activateSuper(players[0]);}
function activateSuper(p){
  if(!p||!p.alive||p.sp<100||p.supT>0||state!=='play')return;
  const S=SH(p),K=S.superKind;p.sp=0;p.supT=SUP_T;p.spAnn=0;

  flash=10;shake=16;sfx('super');burst(p.x,p.y,S.color,50,8);
  if(K==='pulse'){for(const b of eBullets)if(rnd()<.3)burst(b.x,b.y,S.color,3,2);eBullets=[];waves.push({x:p.x,y:p.y,r:10,o:p.id,hit:new Set()});}
  if(K==='fortress'||K==='fusion')p.shield=Math.max(p.shield,SUP_T);

function hurtEnemy(e,dmg,o){if(e.hp<=0)return;e.hp-=dmg;e.hitT=3;e.lastHit=o;}
function superStep(p,S){
  const K=S.superKind,o=p.id,t=SUP_T-p.supT,dm=dmgMul(p);
  if(K==='pulse'){if(t>0&&t%55===0)waves.push({x:p.x,y:p.y,r:10,o,hit:new Set()});}
  else if(K==='storm'){if(frame%3===0){for(const d of [-18,-9,0,9,18])bullets.push({x:p.x+d,y:p.y-18,vx:d*.06+R(-.6,.6),vy:-15,dmg:1,thin:1,o});if(frame%6===0)sfx('shoot');}}
  else if(K==='fortress'){
    if(frame%7===0){const n=13;for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.17;bullets.push({x:p.x,y:p.y-16,vx:Math.sin(a)*10,vy:-Math.cos(a)*10,dmg:2,fat:1,o});}sfx('shoot');}
    for(const e of enemies)if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r+40)hurtEnemy(e,(e.type==='boss'?.05:.3)*dm,o);
  }else if(K==='rain'){
    if(frame%4===0)bullets.push({x:R(20,W-20),y:-10,vx:R(-1,1),vy:7.5,dmg:3,homing:1,life:150,o});
    if(frame%12===0){for(const sd of [-1,1])bullets.push({x:p.x+sd*12,y:p.y-8,vx:sd*5,vy:-4,dmg:3,homing:1,life:120,o});sfx('missile');}
  }else if(K==='fusion'){
    if(frame%4===0){for(const d of [-26,-16,-6,6,16,26])bullets.push({x:p.x+d,y:p.y-30,vx:d*.03,vy:-14,dmg:1.5,o});sfx('shoot');}
    for(const e of enemies)if(e.y<p.y&&Math.abs(e.x-p.x)<24+e.r*.6)hurtEnemy(e,.35*dm,o);
    if(frame%2===0)parts.push({x:p.x+R(-14,14),y:p.y-40-R(0,300),vx:0,vy:-3,life:14,max:14,col:rnd()<.5?'#ffffff':'#ff8fd0',sz:3});
  }
}
function updateWaves(){
  for(const w of waves){w.r+=14;const p=players[w.o]||players[0];
    for(const e of enemies){if(w.hit.has(e))continue;const d=Math.hypot(e.x-w.x,e.y-w.y);if(d<w.r+e.r){w.hit.add(e);hurtEnemy(e,6*dmgMul(p),w.o);burst(e.x,e.y,'#7df9ff',8,3);}}
    for(const b of eBullets)if(!b.dead&&Math.hypot(b.x-w.x,b.y-w.y)<w.r)b.dead=1;}

}

// advance to the next stage: 2 waves + boss per level, 6 levels
function nextStage(){
  if(stage===STAGES){
    if(level>=LEVELS.length){winGame();return;}
    level++;stage=0;setBg(level-1,false);
  }
  stage++;wave++;
  const g=wave; // global difficulty step (1..18)
  if(stage===1)for(const p of players){p.ls=p.score;p.lh=0;}
  for(const p of alivePlayers()){if(SH(p).special==='waveShield')p.shield=Math.max(p.shield,240);if(p.up[3])p.shield=Math.max(p.shield,60*p.up[3]);}
  if(stage===1){banner('NIVEL '+level,'#ffffff',170,-70,40);banner(LEVELS[level-1].name,LEVELS[level-1].grid,170,-30,26);}
  stageActive=true;
  if(stage===STAGES){
    spawn('boss',W/2,-80,{vy:1.6,lvl:level});const b=enemies[enemies.length-1];b.hp=b.max=(60+level*30)*(players.length>1?1.5:1)|0;boss=b;
    banner(level===LEVELS.length?'⚠ GUARDIÁN DEL SOL ⚠':'⚠ ALERTA: NAVE NODRIZA ⚠','#ff5e3a',120,0,30);return;
  }
  if(stage>1)banner('OLEADA '+stage+'/'+(STAGES-1),LEVELS[level-1].grid,90,-40,30);
  const n=Math.min(5+g*2,22),pattern=(level+stage)%3,cols=6;
  for(let i=0;i<n;i++){
    const c=i%cols,row=(i/cols)|0,x=W/2+(c-(cols-1)/2)*95,y=-30-row*60;
    if(pattern===1)spawn('drone',x,y,{vy:1.3+g*.06,phase:row});
    else if(pattern===2)spawn(c%3===1?'zig':'drone',x+(row%2)*40,y,{vy:1.3+g*.05,phase:row});
    else spawn(i%6===2?'tank':(i%2?'zig':'drone'),x,y,{vy:1.1+g*.045,phase:row});
  }
}

    for(const d of sets)bullets.push({x:p.x+d,y:p.y-20,vx:0,vy:-14,dmg:1,thin:1,o});
    sfx('shoot');

    const n=[3,5,7,9][lv-1];
    for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.13;bullets.push({x:p.x,y:p.y-14,vx:Math.sin(a)*9,vy:-Math.cos(a)*9,dmg:1,fat:1,o});}
    sfx('shoot');
  }else if(S.fire==='homing'){

    for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*.45;bullets.push({x:p.x,y:p.y-8,vx:Math.cos(a)*6,vy:Math.sin(a)*6,dmg:2,homing:1,life:110,o});}
    sfx('missile');

    const sets=[[-6,6],[-9,0,9],[-12,-4,4,12],[-14,-7,0,7,14]][lv-1];
    for(const d of sets)bullets.push({x:p.x+d,y:p.y-16,vx:d*.03,vy:-12,dmg:1,o});

function updateBuddy(p,S){
  const b=p.buddy;if(!b)return;
  if(p.supT>0&&S.superKind==='fusion'){b.x+=(p.x-b.x)*.25;b.y+=(p.y-b.y)*.25;return;}
  if(p.x<70)b.side=1;else if(p.x>W-70)b.side=-1;
  const tx=p.x+b.side*36,ty=p.y+14+Math.sin(frame*.09)*4;
  b.x+=(tx-b.x)*.14;b.y+=(ty-b.y)*.14;
  if(--b.cd<=0){b.cd=S.companion.cooldown*cdMul(p);
    bullets.push({x:b.x,y:b.y-10,vx:0,vy:-11,dmg:1,buddy:1,o:p.id});
    if(p.power>=3)bullets.push({x:b.x,y:b.y-10,vx:b.side*1.2,vy:-10.5,dmg:1,buddy:1,o:p.id});}
}
function steerMissile(b){
  let t=null,bd=1e9;
  for(const e of enemies){if(e.hp<=0||e.y<-10)continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;t=e;}}
  let a=Math.atan2(b.vy,b.vx);
  if(t){let da=Math.atan2(t.y-b.y,t.x-b.x)-a;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;a+=Math.max(-.11,Math.min(.11,da));}
  b.vx=Math.cos(a)*7.5;b.vy=Math.sin(a)*7.5;
  if(--b.life<=0)b.dead=1;
  if((frame&1)===0)parts.push({x:b.x,y:b.y,vx:-b.vx*.08,vy:-b.vy*.08,life:14,max:14,col:'#ff9f1c',sz:2});
}

// ---------- demo AI (solo / pantalla de título) ----------
function aiInput(){
  const p=player;let tx=p.x,ty=H-90;
  let best=null,bs=1e9;for(const e of enemies){if(e.y<-20)continue;const s=Math.abs(e.x-p.x)+(H-e.y)*.6;if(s<bs){bs=s;best=e;}}
  if(best)tx=best.x;
  for(const k of pickups){if(k.y>H*.4||(k.k==='H'&&k.y>H*.2&&enemies.length===0)){tx=k.x;ty=Math.min(H-50,Math.max(k.y+10,H*.45));}}
  let dx=0,dy=0;
  for(const b of eBullets){const ddx=p.x-b.x,ddy=p.y-b.y,d=Math.hypot(ddx,ddy);if(d<90&&b.y<p.y+20){dx+=ddx/d*(90-d);dy+=ddy/d*(90-d)*.5;}}
  for(const e of enemies){const ddx=p.x-e.x,ddy=p.y-e.y,d=Math.hypot(ddx,ddy);if(d<e.r+70&&ddy<e.r+90){dx+=ddx/d*(e.r+70-d)*1.5;dy+=ddy/d*(e.r+70-d);}}
  tx+=dx*2.2;ty+=dy*1.5;
  if(p.sp>=100&&enemies.length>3)activateSuper(p);
  return{x:Math.max(-1,Math.min(1,(tx-p.x)/30)),y:Math.max(-1,Math.min(1,(ty-p.y)/30)),fire:true};
}

// ---------- update ----------
function update(){
  frame++;
  if(bgFade<1)bgFade=Math.min(1,bgFade+1/90);
  for(const s of stars){s.y+=s.z*(state==='play'?3:1.2);if(s.y>H){s.y=0;s.x=R(0,W);}}
  if(mode==='guest'){if(state==='play'||state==='over'||state==='win')guestTick();else updateFx();return;}
  if(hangarMsg&&--hangarMsg.t<=0)hangarMsg=null;
  if(state==='hangar'||state==='online'||state==='map'||state==='pause'||(state==='title'&&!demo))return;
  if(state==='over'||state==='win'){updateFx();if(mode==='host'&&frame%2===0)sendSnapshot();return;}
  simulate();
  if(mode==='host'&&frame%2===0)sendSnapshot();
}
function simulate(){
  for(const p of players){
    if(!p.alive)continue;
    const S=SH(p);
    if(mode==='host'&&p.id===1){ // remote player (J2): position comes from the guest
      const r=net.remote;if(r){p.x+=(Math.max(16,Math.min(W-16,r.x))-p.x)*.6;p.y+=(Math.max(40,Math.min(H-24,r.y))-p.y)*.6;p.tilt=r.tl||0;}
    }else{
      const inp=(demo&&mode==='solo')?aiInput():localInput(p),ac=accelOf(p);
      p.vx+=inp.x*ac;p.vy+=inp.y*ac;p.vx*=.82;p.vy*=.82;p.x+=p.vx;p.y+=p.vy;
      p.x=Math.max(16,Math.min(W-16,p.x));p.y=Math.max(40,Math.min(H-24,p.y));p.tilt+=(p.vx*.06-p.tilt)*.3;
    }
    if(p.inv>0)p.inv--;if(p.shield>0)p.shield--;
    if(p.cd>0)p.cd--;
    if(p.cd<=0){p.cd=S.cooldown*cdMul(p);fireWeapon(p,S);} // auto-fire
    if(p.supT>0){p.supT--;superStep(p,S);}
    updateBuddy(p,S);
  }
  const slow=players.some(p=>p.alive&&p.supT>0&&SH(p).superKind==='storm')?.35:1;
  slowAcc+=slow;let steps=0;while(slowAcc>=1){steps++;slowAcc--;}
  if(enemies.length===0){
    if(stageActive)stageCleared();
    else if(--waveTimer<=0){nextStage();if(state!=='play')return;waveTimer=70;}
  }
  for(const e of enemies){
    if(e.hitT>0)e.hitT--;
    for(let st=0;st<steps;st++){
    e.t++;
    if(e.type==='drone'){e.y+=e.vy;e.x+=Math.sin((e.t+e.phase*20)*.04)*1.6;}
    else if(e.type==='zig'){e.y+=e.vy;e.x+=Math.sin((e.t+e.phase*15)*.09)*3.4;if(e.t%90===40&&e.y>0)shootAt(e,3.2);}
    else if(e.type==='tank'){e.y+=e.vy*.6;if(e.t%70===30&&e.y>0){for(let a=-1;a<=1;a++)eBullets.push({x:e.x,y:e.y+18,vx:a*1.4,vy:3});}}
    else if(e.type==='boss'){
      if(e.y<110)e.y+=e.vy;else{e.x=W/2+Math.sin(e.t*.012)*230;}
      if(e.y>=100){
        const rate=Math.max(7,14-e.lvl);
        if(e.t%rate===0){const a=e.t*.09,arms=e.lvl>=4?4:3;for(let k=0;k<arms;k++){const aa=a+k*6.283/arms;eBullets.push({x:e.x,y:e.y+20,vx:Math.cos(aa)*2.6,vy:Math.abs(Math.sin(aa))*2.6+1});}}
        if(e.lvl>=2&&e.t%60===0)for(let k=-2;k<=2;k++)eBullets.push({x:e.x+k*20,y:e.y+40,vx:k*.5,vy:4});
      }
    }
    }
    e.x=Math.max(e.r,Math.min(W-e.r,e.x));
    if(e.type!=='boss'&&e.y>H+40){e.y=-40;e.x=R(40,W-40);}
    for(const p of players){if(!p.alive||p.inv>0)continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r-4){hurt(p);if(state!=='play')return;if(e.type!=='boss')e.hp=0;}}
  }
  for(const b of bullets){
    if(b.homing)steerMissile(b);
    b.x+=b.vx;b.y+=b.vy;
    for(const e of enemies){if(e.hp>0&&Math.abs(b.x-e.x)<e.r&&Math.abs(b.y-e.y)<e.r){const bp=players[b.o|0];e.hp-=(b.dmg||1)*dmgMul(bp);e.hitT=4;e.lastHit=b.o|0;b.dead=1;
      if(e.type==='boss'&&bp&&bp.supT<=0)bp.sp=Math.min(100,bp.sp+.12);

  }

    const pts=(e.type==='boss'?T.pts*e.lvl:T.pts)*k.combo;k.score+=pts;k.kills++;k.combo=Math.min(k.combo+1,8);k.comboT=110;
    addFloat({x:e.x,y:e.y,t:40,s:'+'+pts,c:mode==='solo'?e.col:PCOL[k.id]});
    if(e.type==='boss'){for(let i=0;i<8;i++)burst(e.x+R(-50,50),e.y+R(-30,30),i%2?'#ffd23f':'#ff5e3a',30,7);shake=30;flash=12;sfx('big');boss=null;
      for(let i=0;i<2;i++)pickups.push({x:e.x+(i?30:-30),y:e.y,k:i?'S':'P',t:0});
      dropCrystals(e.x,e.y,12,true);levelComplete(e.lvl||level);}
    else{burst(e.x,e.y,e.col,e.type==='tank'?36:18,e.type==='tank'?6:4);shake=Math.max(shake,e.type==='tank'?10:4);sfx('boom');

  }

  for(const b of eBullets){for(let st=0;st<steps;st++){b.x+=b.vx;b.y+=b.vy;}
    for(const p of players){if(!p.alive||b.dead)continue;
      if(p.supT>0&&SH(p).superKind==='fortress'&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+40){b.dead=1;if(rnd()<.4)burst(b.x,b.y,SH(p).color,4,2);continue;}
      if(Math.hypot(b.x-p.x,b.y-p.y)<p.r-3){if(p.shield>0){b.dead=1;burst(b.x,b.y,SH(p).color,6,2);}else if(p.inv<=0){b.dead=1;hurt(p);if(state!=='play')return;}}}}
  for(const k of pickups){k.t++;
    if(k.k==='C'){if(k.vx!==undefined){k.x+=k.vx;k.y+=k.vy;k.vx*=.93;k.vy*=.93;}k.y+=1.1;
      let t=null,bd=1e9;for(const p of players){if(!p.alive)continue;const d=Math.hypot(p.x-k.x,p.y-k.y);if(d<bd){bd=d;t=p;}}

function updateFx(){

    for(let i=0;i<30;i++){const a=i/30*6.283,s=2+Math.random()*2.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:50,max:50,col:c,sz:2.5});}}}

function shootAt(e,s){let t=null,bd=1e9;for(const p of players){if(!p.alive)continue;const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<bd){bd=d;t=p;}}if(!t)return;

const SHAPES={
  arrow:{hull:[0,-18,14,12,5,7,-5,7,-14,12],flames:[[0,12,5]],core:[0,-2,3.5]},
  dart:{hull:[0,-24,4,-6,13,9,4,5,0,11,-4,5,-13,9,-4,-6],flames:[[0,11,3]],core:[0,-6,2.5]},
  heavy:{hull:[0,-17,9,-11,11,-3,20,1,20,13,10,10,6,14,-6,14,-10,10,-20,13,-20,1,-11,-3,-9,-11],flames:[[-14,13,4],[14,13,4]],core:[0,0,5]},

function drawShip(x,y,tilt,S,sc=1,col){
  const sh=SHAPES[S.shape],c=col||S.color;
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(sc,sc);
  const fl=8+Math.sin(frame*.8)*4;
  glow('#ff9f1c',20);ctx.fillStyle='#ff9f1c';
  for(const [fx,fy,fw] of sh.flames){ctx.beginPath();ctx.moveTo(fx-fw,fy);ctx.lineTo(fx,fy+fl);ctx.lineTo(fx+fw,fy);ctx.fill();}
  glow(c,18);ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.fillStyle='#1a0b2e';
  poly(sh.hull);ctx.fill();ctx.stroke();
  if(S.shape==='heavy'){ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(6,-6);ctx.stroke();}
  if(S.shape==='fork'){ctx.beginPath();ctx.moveTo(-10,-21);ctx.lineTo(-10,-12);ctx.moveTo(10,-21);ctx.lineTo(10,-12);ctx.stroke();}
  ctx.fillStyle=c;
  if(sh.core){ctx.beginPath();ctx.arc(sh.core[0],sh.core[1],sh.core[2],0,7);ctx.fill();}

    text(LEVELS[level-1].name,W/2,42,11,L.grid+'cc','center',0);
    if(players[me]&&!players[me].alive)text('ESTÁS FUERA — mirando a tu amigo…',W/2,H-18,15,'#ffffffcc','center',6);
  }
  if(state==='title'){
    ctx.fillStyle='#05010f88';ctx.fillRect(0,0,W,H);
    text('NEON DRIFT',W/2,H/2-80,64,'#ff3cac','center',30);
    text('un pequeño shooter espacial arcade',W/2,H/2-42,18,'#7df9ff','center',10);
    drawMenu('#ffd23f');
    text('Nave: '+S.name,W/2,H/2+140,16,S.color,'center',8);
    if(hi)text('RÉCORD '+hi,W/2,H/2+164,15,'#7cff6b','center',8);
    crystalTag(W/2,H/2+190,16,'center');
    text('Mover: flechas / WASD / arrastrar   •   Disparo automático   •   ESPACIO: súper   •   P pausa   •   M silencio',W/2,H-24,12,'#ffffffcc','center',0);
  }
  if(state==='pause'){ctx.fillStyle='#05010faa';ctx.fillRect(0,0,W,H);text('PAUSA',W/2,H/2,48,'#7df9ff');text('presiona P para continuar',W/2,H/2+36,16,'#fff','center',0);}
  if(mp&&(state==='over'||state==='win'))drawMpEnd();
  else if(state==='over'){const p=players[0];ctx.fillStyle='#05010fbb';ctx.fillRect(0,0,W,H);text('FIN DEL JUEGO',W/2,H/2-50,56,'#ff3cac','center',26);
    text('PUNTOS '+p.score+(p.score>=hi&&p.score>0?'  — ¡NUEVO RÉCORD!':''),W/2,H/2-8,20,'#ffd23f');
    text('+'+p.cry+' cristales en esta partida  •  total:',W/2-30,H/2+22,14,'#d9ccff','center',0);crystalTag(W/2+150,H/2+22,14,'left');
    drawMenu('#7df9ff');
    text('Llegaste al nivel '+level+' ('+LEVELS[level-1].name+')   •   Nave: '+S.name,W/2,H/2+124,13,'#ffffffaa','center',0);
    text('Gasta tus cristales en el HANGAR para mejorar tu nave',W/2,H/2+146,12,'#b89cff','center',0);}
  else if(state==='win'){const p=players[0];ctx.fillStyle='#05010f99';ctx.fillRect(0,0,W,H);
    const s=1+Math.sin(frame*.08)*.04;ctx.save();ctx.translate(W/2,H/2-70);ctx.scale(s,s);text('¡GANASTE!',0,0,64,'#ffd23f','center',30);ctx.restore();
    text('Salvaste las 6 galaxias con '+S.name,W/2,H/2-28,18,'#ffffff','center',8);
    text('PUNTOS '+p.score+(p.score>=hi&&p.score>0?'  — ¡NUEVO RÉCORD!':''),W/2,H/2+2,20,'#ff8fd0','center',10);
    text('+'+p.cry+' cristales en esta partida  •  total:',W/2-30,H/2+28,14,'#d9ccff','center',0);crystalTag(W/2+150,H/2+28,14,'left');
    drawMenu('#ffd23f');}
  ctx.restore();
}

// ---------- loop ----------
if(DEMO_FORCED||CAPTURE){startGame(true);}
const STEP=1000/60;let acc=0,last=performance.now();
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){update();acc-=STEP;}draw();requestAnimationFrame(loop);}
// read-only status hook used by automated tests
window.__status=()=>{const p=players[0]||{};return{state,frame,mode,shipIdx,hangarSel,ship:SHIPS[shipIdx].name,lives:p.lives,score:p.score,wave,level,stage,bullets:bullets.length,
  homing:bullets.filter(b=>b.homing).length,buddyShots:bullets.filter(b=>b.buddy).length,buddy:!!p.buddy,hearts:pickups.filter(k=>k.k==='H').length,
  shield:p.shield,radius:p.r,sp:p.sp,supT:p.supT,cry:p.cry,crystals,accelEff:p.up?accelOf(p):0,dmgEff:p.up?dmgMul(p):0,cdEff:p.up?cdMul(p):0,up:p.up,upg:getUpg(shipIdx),map:JSON.parse(JSON.stringify(mapP)),mapSel,playLv,waves:waves.length,accel:SHIPS[shipIdx].accel,x:p.x,bg:bgLevel,floaters:floaters.map(f=>f.s),
  net:{startLv:net.startLv,role:net.role,phase:net.phase,code:net.code,error:net.error,status:net.status,connected:net.connected,peerShip:net.peerShip,myReady:net.myReady,peerReady:net.peerReady,snaps:net.snaps.length},
  players:players.map(q=>({id:q.id,ship:SHIPS[q.ship].name,sp:Math.floor(q.sp),supT:q.supT,cry:q.cry,up:q.up,x:Math.round(q.x),y:Math.round(q.y),lives:q.lives,score:q.score,kills:q.kills,alive:q.alive})),enemies:enemies.length};};
if(DEBUG){ // test-only helpers (only with ?debug in the URL)
  window.__dbg={killAll:()=>{for(const p of players){p.lives=1;p.shield=0;p.inv=0;hurt(p);}},
    setLevel:n=>{level=n;stage=0;wave=(n-1)*STAGES;enemies=[];eBullets=[];stageActive=false;waveTimer=1;setBg(n-1,true);},
    win:()=>{level=LEVELS.length;stage=STAGES;enemies=[];stageActive=false;waveTimer=1;},
    god:on=>{for(const p of players)p.shield=on?1e9:0;},
    fillSuper:()=>{for(const p of players)p.sp=100;},
    bossNow:()=>{stage=STAGES-1;enemies=[];eBullets=[];stageActive=false;waveTimer=1;},
    nuke:()=>{for(const e of enemies){e.hp=0;e.lastHit=0;}},
    trySuper:()=>trySuper()};
}
if(CAPTURE){window.__advance=n=>{for(let i=0;i<n;i++)update();draw();const p=players[0];return{score:p.score,wave,level,stage,lives:p.lives,enemies:enemies.length,bossHp:(enemies.find(e=>e.type==='boss')||{}).hp,power:p.power};};
  window.__setLevel=n=>{level=n;stage=0;wave=(n-1)*STAGES;enemies=[];eBullets=[];stageActive=false;waveTimer=1;setBg(n-1,true);};
  window.__setStage=(n,s)=>{level=n;stage=s-1;wave=(n-1)*STAGES+s-1;enemies=[];eBullets=[];stageActive=false;waveTimer=1;setBg(n-1,true);};
  window.__setState=(s)=>{state=s;draw();};
  window.__setLives=n=>{players[0].lives=n;};
  window.__heartOnPlayer=()=>{pickups.push({x:player.x,y:player.y,k:'H',t:0});};
  window.__boost=n=>{players[0].power=n;};
  window.__demo=v=>{demo=v;};
  window.__info=()=>({state,score:players[0].score,wave,lives:players[0].lives});draw();}
else requestAnimationFrame(loop);
// PWA: juego instalable y jugable sin conexión (no en itch.io ni al abrir el archivo directamente)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/itch\.io$|itch\.zone$|hwcdn\.net$/.test(location.hostname)&&!CAPTURE)
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
})();
</script>
